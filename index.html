<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🏆 決戰會考 錯題本 (雲端知識點版)</title>
  
  <!-- 引入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 引入 React 與 ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- 引入 Babel 讓瀏覽器可以編譯 JSX -->
  <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>

  <!-- 引入 KaTeX 數學渲染套件 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

  <!-- 引入 Tesseract.js 用於自動辨識文字尺寸 -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    /* 解決 iPadOS/iOS 切換內容時，文字自動縮放與捲軸出現/消失造成的版面跳動 */
    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      overflow-y: scroll;
    }

    /* 列印專用樣式 - 強制純白背景與色彩精準列印 */
    @media print {
      body, html, #root, .min-h-screen, .bg-\[\#fffbeb\] { background-color: #ffffff !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
      body * { visibility: hidden; }
      #print-area, #print-area * { visibility: visible; }
      #print-area { position: absolute; left: 0; top: 0; width: 100%; padding: 0 !important; background-color: #ffffff !important; }
      .no-print { display: none !important; }
      @page { margin: 0.8cm 1.5cm; size: A4 portrait; }
      .print-card { padding: 0.15rem 0 !important; margin-bottom: 0.35rem !important; border: none !important; border-bottom: 1px dashed #e5e7eb !important; border-radius: 0 !important; box-shadow: none !important; background-color: #ffffff !important; }
      
      .print-img { 
          max-width: 100% !important; 
          max-height: none !important; 
          object-fit: contain; 
          margin-left: 0 !important; 
          margin-right: auto !important; 
          image-rendering: -webkit-optimize-contrast; 
          image-rendering: crisp-edges; 
      }
      .print-header { margin-bottom: 1rem !important; padding-bottom: 0.5rem !important; }
    }
    
    body {
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      overscroll-behavior-y: none;
    }
    
    input[type="date"]::-webkit-calendar-picker-indicator {
        cursor: pointer;
        opacity: 0.6;
        transition: 0.2s;
    }
    input[type="date"]::-webkit-calendar-picker-indicator:hover {
        opacity: 1;
    }
  </style>
</head>
<body class="bg-[#fffbeb]">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback, createContext, useContext, useMemo } = React;

    const getTodayStr = () => {
        const d = new Date();
        const yyyy = d.getFullYear();
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const dd = String(d.getDate()).padStart(2, '0');
        return `${yyyy}-${mm}-${dd}`;
    };

    const getDateStr = (timestamp) => {
        if (!timestamp) return getTodayStr();
        const d = new Date(timestamp);
        const yyyy = d.getFullYear();
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const dd = String(d.getDate()).padStart(2, '0');
        return `${yyyy}-${mm}-${dd}`;
    };

    const THEME = {
      primary: '#f59e0b', 
      primaryHover: '#d97706', 
      textPrimary: '#b45309', 
      textDark: '#451a03', 
      bg: '#fffbeb', 
      white: '#ffffff',
      red: '#ef4444' 
    };

    const SUBJECT_ORDER = ['國文', '英文', '數學', '生物', '理化', '地球科學', '歷史', '地理', '公民'];

    const Icons = {
      Book: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20" /></svg>,
      Camera: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" /><circle cx="12" cy="13" r="4" /></svg>,

      Wand: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m21.64 3.64-1.28-1.28a1.21 1.21 0 0 0-1.72 0L2.36 18.64a1.21 1.21 0 0 0 0 1.72l1.28 1.28a1.2 1.2 0 0 0 1.72 0L21.64 5.36a1.2 1.2 0 0 0 0-1.72Z" /><path d="m14 7 3 3" /><path d="M5 6v4" /><path d="M19 14v4" /><path d="M10 2v2" /><path d="M7 8H3" /><path d="M21 16h-4" /><path d="M11 3H9" /></svg>,

      Eye: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>,
      EyeOff: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/></svg>,
      Printer: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 6 2 18 2 18 9" /><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2" /><rect width="12" height="8" x="6" y="14" /></svg>,
      ArrowLeft: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="19" y1="12" x2="5" y2="12" /><polyline points="12 19 5 12 12 5" /></svg>,
      Contrast: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 18a6 6 0 0 0 0-12v12z"/></svg>,
      Cloud: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg>,
      Settings: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>,
      Close: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>,
      Undo: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>,
      Rotate: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>,
      Search: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>,
      FontScale: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>,
      StatusDot: ({ color }) => <svg width="12" height="12" viewBox="0 0 24 24" fill={color} stroke={color} strokeWidth="2"><circle cx="12" cy="12" r="8"/></svg>,
      ZoomIn: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="11" y1="8" x2="11" y2="14"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>,
      Calendar: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>,
      BookOpen: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>
    };

    const ModalContext = createContext();

    const ModalProvider = ({ children }) => {
      const [modal, setModal] = useState({ isOpen: false, type: 'alert', message: '', onConfirm: null, onCancel: null });

      const showAlert = (message) => {
        setModal({ isOpen: true, type: 'alert', message, onConfirm: null, onCancel: null });
      };

      const showConfirm = (message, onConfirm, onCancel = null) => {
        setModal({ isOpen: true, type: 'confirm', message, onConfirm, onCancel });
      };

      const close = () => setModal({ ...modal, isOpen: false });

      return (
        <ModalContext.Provider value={{ showAlert, showConfirm }}>
          {children}
          {modal.isOpen && (
            <div className="fixed inset-0 z-[9999] flex items-center justify-center bg-black/60 backdrop-blur-sm p-4 animate-[fadeIn_0.2s_ease-out]">
              <div className="bg-white rounded-2xl shadow-2xl max-w-sm w-full p-6 text-center transform scale-100 transition-transform">
                <div className="w-16 h-16 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mx-auto mb-4">
                  {modal.type === 'confirm' ? <Icons.Wand /> : <Icons.Book />}
                </div>
                <p className="text-lg font-bold text-gray-800 mb-6 whitespace-pre-wrap">{modal.message}</p>
                <div className="flex justify-center gap-3">
                  {modal.type === 'confirm' && (
                    <button onClick={() => { close(); if(modal.onCancel) modal.onCancel(); }} className="px-5 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl font-bold transition-colors w-full">
                      取消
                    </button>
                  )}
                  <button onClick={() => { close(); if(modal.onConfirm) modal.onConfirm(); }} className="px-5 py-2.5 bg-[#f59e0b] hover:bg-[#d97706] text-white rounded-xl font-bold transition-colors w-full">
                    確定
                  </button>
                </div>
              </div>
            </div>
          )}
        </ModalContext.Provider>
      );
    };

    const useModal = () => useContext(ModalContext);

    function LatexText({ content, className }) {
      const containerRef = useRef(null);
      useEffect(() => {
        if (containerRef.current && window.renderMathInElement) {
          containerRef.current.innerText = content || '';
          window.renderMathInElement(containerRef.current, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false,
            output: 'html'
          });
        }
      }, [content]);
      return <div ref={containerRef} className={className}></div>;
    }

    function NoteCanvas({ initialDataUrl, onChange }) {
      const { showConfirm } = useModal();
      const containerRef = useRef(null);
      const canvasRef = useRef(null);
      const ctxRef = useRef(null);
      const [mode, setMode] = useState('pen');
      const [color, setColor] = useState('#000000');
      const [penSize, setPenSize] = useState(6);
      const [eraserSize, setEraserSize] = useState(40);
      
      const isDrawing = useRef(false);
      const lastPosRef = useRef({x: 0, y: 0});
      const activePointers = useRef(new Map());
      const canvasRectRef = useRef(null);

      useEffect(() => {
        const container = containerRef.current;
        if (!container) return;
        const handleTouchMove = (e) => {
           if (e.cancelable) e.preventDefault();
        };
        container.addEventListener('touchmove', handleTouchMove, { passive: false });
        return () => container.removeEventListener('touchmove', handleTouchMove);
      }, []);

      useEffect(() => {
          const canvas = canvasRef.current;
          const ctx = canvas.getContext('2d');
          ctxRef.current = ctx;
          canvas.width = 1200;
          canvas.height = 800;
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          
          if (initialDataUrl && initialDataUrl.startsWith('data:image')) {
              const img = new Image();
              img.onload = () => {
                  ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
              };
              img.src = initialDataUrl;
          }
      }, []);

      const getPos = (clientX, clientY) => {
          const canvas = canvasRef.current;
          const rect = canvasRectRef.current || canvas.getBoundingClientRect();
          const scaleX = canvas.width / rect.width;
          const scaleY = canvas.height / rect.height;
          return {
              x: (clientX - rect.left) * scaleX,
              y: (clientY - rect.top) * scaleY,
              scaleX
          };
      };

      const startDraw = (e) => {
          activePointers.current.set(e.pointerId, e);
          try { e.currentTarget.setPointerCapture(e.pointerId); } catch(err) {}
          
          if (activePointers.current.size >= 2) {
             isDrawing.current = false;
             return;
          }

          isDrawing.current = true;
          canvasRectRef.current = canvasRef.current.getBoundingClientRect();
          const { x, y, scaleX } = getPos(e.clientX, e.clientY);
          lastPosRef.current = { x, y };
          
          const ctx = ctxRef.current;
          const currentSize = (mode === 'eraser' ? eraserSize : penSize) * scaleX;
          ctx.beginPath();
          ctx.arc(x, y, currentSize / 2, 0, Math.PI * 2);
          ctx.fillStyle = mode === 'eraser' ? '#ffffff' : color;
          ctx.fill();
      };

      const moveDraw = (e) => {
          if (!activePointers.current.has(e.pointerId)) return;
          activePointers.current.set(e.pointerId, e);

          if (activePointers.current.size >= 2) return;
          if (!isDrawing.current) return;
          
          const pointer = e;
          const ctx = ctxRef.current;
          const { scaleX } = getPos(pointer.clientX, pointer.clientY);
          
          ctx.lineWidth = (mode === 'eraser' ? eraserSize : penSize) * scaleX;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.strokeStyle = mode === 'eraser' ? '#ffffff' : color;
          
          const eventsToProcess = (pointer.nativeEvent && typeof pointer.nativeEvent.getCoalescedEvents === 'function')
              ? pointer.nativeEvent.getCoalescedEvents()
              : [pointer.nativeEvent || pointer];

          ctx.beginPath();
          ctx.moveTo(lastPosRef.current.x, lastPosRef.current.y);
          
          let lastPos = lastPosRef.current;
          for (let i = 0; i < eventsToProcess.length; i++) {
              const ev = eventsToProcess[i];
              const { x, y } = getPos(ev.clientX, ev.clientY);
              ctx.lineTo(x, y);
              lastPos = { x, y };
          }
          ctx.stroke();
          lastPosRef.current = lastPos;
      };

      const endDraw = (e) => {
          if (e && e.pointerId) {
              activePointers.current.delete(e.pointerId);
              try { e.currentTarget.releasePointerCapture(e.pointerId); } catch(err) {}
          } else {
              activePointers.current.clear();
          }

          if (activePointers.current.size === 0) {
              if (isDrawing.current) {
                  isDrawing.current = false;
                  if (ctxRef.current) ctxRef.current.beginPath();
                  let outUrl = canvasRef.current.toDataURL('image/webp', 0.8);
                  if (outUrl.startsWith('data:image/png')) outUrl = canvasRef.current.toDataURL('image/jpeg', 0.8);
                  onChange(outUrl);
              }
              canvasRectRef.current = null;
          }
      };

      const handleClear = () => {
          showConfirm('確定要清除所有手寫筆記嗎？', () => {
              const canvas = canvasRef.current;
              const ctx = ctxRef.current;
              ctx.fillStyle = '#ffffff';
              ctx.fillRect(0, 0, canvas.width, canvas.height);
              onChange('');
          });
      };

      return (
          <div className="border border-amber-200 rounded-xl overflow-hidden bg-white flex flex-col">
              <div className="flex flex-col sm:flex-row items-start sm:items-center gap-3 p-3 bg-amber-50 border-b border-amber-200 w-full">
                  <div className="flex items-center gap-2">
                      <button onClick={() => { setMode('pen'); setColor('#000000'); }} className={`w-8 h-8 rounded-full border-2 transition-transform flex-shrink-0 ${mode === 'pen' && color === '#000000' ? 'scale-125 border-gray-400 shadow-md' : 'border-transparent'}`} style={{backgroundColor: '#000000'}} title="黑筆"></button>
                      <button onClick={() => { setMode('pen'); setColor('#ef4444'); }} className={`w-8 h-8 rounded-full border-2 transition-transform flex-shrink-0 ${mode === 'pen' && color === '#ef4444' ? 'scale-125 border-gray-400 shadow-md' : 'border-transparent'}`} style={{backgroundColor: '#ef4444'}} title="紅筆"></button>
                      <button onClick={() => { setMode('pen'); setColor('#3b82f6'); }} className={`w-8 h-8 rounded-full border-2 transition-transform flex-shrink-0 ${mode === 'pen' && color === '#3b82f6' ? 'scale-125 border-gray-400 shadow-md' : 'border-transparent'}`} style={{backgroundColor: '#3b82f6'}} title="藍筆"></button>
                      
                      <div className="w-px h-6 bg-amber-200 mx-1"></div>
                      
                      <button onClick={() => setMode('eraser')} className={`p-2 rounded-lg transition-colors flex items-center gap-1 font-bold text-sm flex-shrink-0 ${mode === 'eraser' ? 'bg-amber-600 text-white shadow-md' : 'text-gray-600 hover:bg-amber-100'}`}>

                          <button onClick={() => setPenSize(24)} className={`w-9 h-9 flex items-center justify-center rounded-full transition-all flex-shrink-0 ${penSize === 24 ? 'bg-amber-200 shadow-inner' : 'hover:bg-amber-100'}`} title="特粗"><div className="rounded-full" style={{ width: 24, height: 24, backgroundColor: color }}></div></button>

                          <button onClick={() => setEraserSize(40)} className={`w-9 h-9 flex items-center justify-center rounded-full transition-all flex-shrink-0 ${eraserSize === 40 ? 'bg-white shadow-md scale-110' : 'text-gray-500 hover:bg-amber-100'}`} title="中"><div className="w-5 h-5 rounded-full bg-current"></div></button>
                          <button onClick={() => setEraserSize(70)} className={`w-9 h-9 flex items-center justify-center rounded-full transition-all flex-shrink-0 ${eraserSize === 70 ? 'bg-white shadow-md scale-110' : 'text-gray-500 hover:bg-amber-100'}`} title="大"><div className="w-7 h-7 rounded-full bg-current"></div></button>
                          <button onClick={() => setEraserSize(100)} className={`w-9 h-9 flex items-center justify-center rounded-full transition-all flex-shrink-0 ${eraserSize === 100 ? 'bg-white shadow-md scale-110' : 'text-gray-500 hover:bg-amber-100'}`} title="特大"><div className="w-9 h-9 rounded-full bg-current"></div></button>

                      ref={canvasRef}

                      style={{ objectFit: 'contain' }}

      );
    }

    function solveMatrix(A, b) {
      const n = 8;
      for (let i = 0; i < n; i++) {
        let max = i;
        for (let j = i + 1; j < n; j++) if (Math.abs(A[j][i]) > Math.abs(A[max][i])) max = j;
        [A[i], A[max]] = [A[max], A[i]];
        [b[i], b[max]] = [b[max], b[i]];
        for (let j = i + 1; j < n; j++) {
          const factor = A[j][i] / A[i][i];
          b[j] -= factor * b[i];
          for (let k = i; k < n; k++) A[j][k] -= factor * A[i][k];
        }
      }
      const x = new Array(n).fill(0);
      for (let i = n - 1; i >= 0; i--) {
        let sum = b[i];
        for (let j = i + 1; j < n; j++) sum -= A[i][j] * x[j];
        x[i] = sum / A[i][i];
      }
      return x;
    }

    function getHomography(src, dst) {
      const A = [], B = [];
      for (let i = 0; i < 4; i++) {
        const u = dst[i].x, v = dst[i].y, x = src[i].x, y = src[i].y;
        A.push([u, v, 1, 0, 0, 0, -x * u, -x * v]); B.push(x);
        A.push([0, 0, 0, u, v, 1, -y * u, -y * v]); B.push(y);
      }
      return solveMatrix(A, B);
    }

    function CropView({ imageUrl, onCancel, onComplete, onUpdateRawImage }) {
      const containerRef = useRef(null);
      const imgRef = useRef(null);
      
      const [pts, setPts] = useState([
        { x: 10, y: 10 }, { x: 90, y: 10 }, 
        { x: 90, y: 90 }, { x: 10, y: 90 }
      ]);
      const [draggingIdx, setDraggingIdx] = useState(null);

      const startDrag = (e, idx) => {
        e.preventDefault();
        setDraggingIdx(idx);
      };

      const onDrag = useCallback((e) => {
        if (draggingIdx === null || !containerRef.current) return;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const rect = containerRef.current.getBoundingClientRect();
        
        let nx = ((clientX - rect.left) / rect.width) * 100;
        let ny = ((clientY - rect.top) / rect.height) * 100;
        nx = Math.max(0, Math.min(100, nx));
        ny = Math.max(0, Math.min(100, ny));

        setPts(prev => {
          const next = [...prev];
          next[draggingIdx] = { x: nx, y: ny };
          
          if (draggingIdx === 0) { 
            next[1] = { ...next[1], y: ny }; 
            next[3] = { ...next[3], x: nx }; 
          } else if (draggingIdx === 1) { 
            next[0] = { ...next[0], y: ny }; 
            next[2] = { ...next[2], x: nx }; 
          } else if (draggingIdx === 2) { 
            next[3] = { ...next[3], y: ny }; 
            next[1] = { ...next[1], x: nx }; 
          } else if (draggingIdx === 3) { 
            next[2] = { ...next[2], y: ny }; 
            next[0] = { ...next[0], x: nx }; 
          }
          return next;
        });
      }, [draggingIdx]);

      const endDrag = () => setDraggingIdx(null);

      useEffect(() => {
        if (draggingIdx !== null) {
          window.addEventListener('mousemove', onDrag);
          window.addEventListener('mouseup', endDrag);
          window.addEventListener('touchmove', onDrag, { passive: false });
          window.addEventListener('touchend', endDrag);
        }
        return () => {
          window.removeEventListener('mousemove', onDrag);
          window.removeEventListener('mouseup', endDrag);
          window.removeEventListener('touchmove', onDrag);
          window.removeEventListener('touchmove', endDrag);
        };
      }, [draggingIdx, onDrag]);

      const handleRotate = () => {
        const img = new Image();
        img.onload = () => {
          const cvs = document.createElement('canvas');
          cvs.width = img.height;
          cvs.height = img.width;
          const ctx = cvs.getContext('2d');
          ctx.translate(cvs.width / 2, cvs.height / 2);
          ctx.rotate(90 * Math.PI / 180);
          ctx.drawImage(img, -img.width / 2, -img.height / 2);
          onUpdateRawImage(cvs.toDataURL('image/jpeg', 1.0));
          setPts([{ x: 10, y: 10 }, { x: 90, y: 10 }, { x: 90, y: 90 }, { x: 10, y: 90 }]);
        };
        img.src = imageUrl;
      };

      const handleConfirm = () => {
        const img = imgRef.current;
        const srcW = img.naturalWidth;
        const srcH = img.naturalHeight;

        const srcPts = pts.map(p => ({ x: (p.x / 100) * srcW, y: (p.y / 100) * srcH }));

        const dist = (p1, p2) => Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2));
        const outW = Math.round(Math.max(dist(srcPts[0], srcPts[1]), dist(srcPts[3], srcPts[2])));
        const outH = Math.round(Math.max(dist(srcPts[0], srcPts[3]), dist(srcPts[1], srcPts[2])));
        
        const dstPts = [{x:0, y:0}, {x:outW, y:0}, {x:outW, y:outH}, {x:0, y:outH}];
        const H_matrix = getHomography(srcPts, dstPts);

        const srcCvs = document.createElement('canvas');
        srcCvs.width = srcW; srcCvs.height = srcH;
        const srcCtx = srcCvs.getContext('2d');
        srcCtx.drawImage(img, 0, 0);
        const srcData = srcCtx.getImageData(0, 0, srcW, srcH).data;

        const dstCvs = document.createElement('canvas');
        dstCvs.width = outW; dstCvs.height = outH;
        const dstCtx = dstCvs.getContext('2d');
        const dstImgData = dstCtx.createImageData(outW, outH);
        const dstData = dstImgData.data;

        for (let y = 0; y < outH; y++) {
          for (let x = 0; x < outW; x++) {
            const z = H_matrix[6] * x + H_matrix[7] * y + 1;
            const sx = Math.round((H_matrix[0] * x + H_matrix[1] * y + H_matrix[2]) / z);
            const sy = Math.round((H_matrix[3] * x + H_matrix[4] * y + H_matrix[5]) / z);

            const dstIdx = (y * outW + x) * 4;
            if (sx >= 0 && sx < srcW && sy >= 0 && sy < srcH) {
              const srcIdx = (sy * srcW + sx) * 4;
              dstData[dstIdx] = srcData[srcIdx];
              dstData[dstIdx+1] = srcData[srcIdx+1];
              dstData[dstIdx+2] = srcData[srcIdx+2];
              dstData[dstIdx+3] = srcData[srcIdx+3];
            } else {
              dstData[dstIdx+3] = 0; 
            }
          }
        }
        dstCtx.putImageData(dstImgData, 0, 0);
        
        let outUrl = dstCvs.toDataURL('image/webp', 0.85);
        if (outUrl.startsWith('data:image/png')) outUrl = dstCvs.toDataURL('image/jpeg', 0.85);
        onComplete(outUrl);
      };

      const polygonPoints = pts.map(p => `${p.x},${p.y}`).join(' ');

      return (
        <div className="fixed inset-0 bg-gray-900 flex flex-col z-50">
          <div className="flex justify-between items-center p-5 text-white bg-gray-800 shadow-md z-20">
            <button onClick={onCancel} className="p-2"><Icons.ArrowLeft /></button>
            <span className="text-lg font-bold">✂️ 第一步：透視校正裁切</span>
            <button onClick={handleRotate} className="p-2 px-4 bg-gray-700 rounded-lg hover:bg-gray-600 transition-colors flex items-center gap-2 text-base font-bold"><Icons.Rotate /> 旋轉</button>
          </div>
          
          <div className="flex-grow relative overflow-hidden flex items-center justify-center p-4">
            <div ref={containerRef} className="relative inline-block touch-none" style={{ maxWidth: '100%', maxHeight: 'calc(100vh - 160px)' }}>
                <img 
                  ref={imgRef} src={imageUrl} alt="To crop" className="block pointer-events-none" 
                  style={{ maxWidth: '100%', maxHeight: 'calc(100vh - 160px)', width: 'auto', height: 'auto' }}
                />
                
                <svg viewBox="0 0 100 100" preserveAspectRatio="none" className="absolute inset-0 w-full h-full pointer-events-none z-10">
                  <defs>
                    <mask id="crop-mask">
                      <rect width="100" height="100" fill="white" />
                      <polygon points={polygonPoints} fill="black" />
                    </mask>
                  </defs>
                  <rect width="100" height="100" fill="rgba(0,0,0,0.6)" mask="url(#crop-mask)" />
                  <polygon points={polygonPoints} fill="none" stroke="#f59e0b" strokeWidth="3" strokeDasharray="1,1" vectorEffect="non-scaling-stroke" />
                </svg>

                <div className="absolute inset-0 z-20 pointer-events-none">
                  {pts.map((pt, i) => (
                     <div key={i} className="absolute w-10 h-10 bg-white border-4 border-[#f59e0b] rounded-full shadow-lg pointer-events-auto cursor-move transform -translate-x-1/2 -translate-y-1/2 flex items-center justify-center"
                          style={{ top: `${pt.y}%`, left: `${pt.x}%` }}
                          onMouseDown={(e) => startDrag(e, i)} onTouchStart={(e) => startDrag(e, i)}>
                          <div className="w-2 h-2 bg-[#f59e0b] rounded-full"></div>
                     </div>
                  ))}
                </div>
            </div>
          </div>

          <div className="p-6 bg-white rounded-t-3xl flex gap-5 justify-between items-center shadow-lg z-20">
             <button onClick={onCancel} className="px-6 py-4 bg-gray-100 text-gray-700 rounded-xl font-bold text-lg flex-1">🖼️ 重新選圖</button>
             <button onClick={handleConfirm} className="px-6 py-4 bg-[#f59e0b] text-[#ffffff] rounded-xl font-bold text-lg flex-1 flex justify-center items-center gap-2 hover:bg-[#d97706] transition-colors">下一步 ➡️</button>
          </div>
        </div>
      );
    }

    function EditView({ imageUrl, onCancel, onComplete }) {
      const { showAlert } = useModal();
      const containerRef = useRef(null);
      const canvasRef = useRef(null);
      const cursorRef = useRef(null);
      const ctxRef = useRef(null); 
      const isDrawingRef = useRef(false);
      const lastPosRef = useRef({ x: 0, y: 0 });
      
      const activePointers = useRef(new Map());
      const canvasRectRef = useRef(null);

      const [mode, setMode] = useState('none');
      const historyRef = useRef([]); 
      const [canUndo, setCanUndo] = useState(false);
      
      const [eraserSize, setEraserSize] = useState(40);
      const [penSize, setPenSize] = useState(6);
      const [penColor, setPenColor] = useState('#ef4444');
      
      const [showSizePicker, setShowSizePicker] = useState(false);
      const [showPenPicker, setShowPenPicker] = useState(false);
      const [isInteracting, setIsInteracting] = useState(false); 

      const [isOcrLoading, setIsOcrLoading] = useState(false);
      const [ocrProgress, setOcrProgress] = useState('');
      
      const [canvasDim, setCanvasDim] = useState({ w: 0, h: 0 });
      const [exportScale, setExportScale] = useState(1);
      const [pan, setPan] = useState({ x: 0, y: 0 });
      const [rotation, setRotation] = useState(0); 
      const [isPanning, setIsPanning] = useState(false);
      const touchRef = useRef({ dist: 0, angle: 0 }); 
      const panRef = useRef({ startX: 0, startY: 0, startPanX: 0, startPanY: 0 });

      useEffect(() => {
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        ctxRef.current = ctx; 
        const img = new Image();
        img.onload = () => {
          const maxWidth = 2500; 
          let w = img.width, h = img.height;
          if (w > maxWidth) { h = (maxWidth / w) * h; w = maxWidth; }
          canvas.width = w; canvas.height = h;
          setCanvasDim({ w, h });
          ctx.drawImage(img, 0, 0, w, h);
          historyRef.current = [];
          setCanUndo(false);

          if (containerRef.current) {
             const rect = containerRef.current.getBoundingClientRect();
             const initScale = Math.min((rect.width - 40) / w, (rect.height - 100) / h, 1);
             setExportScale(initScale);
          }
        };
        img.src = imageUrl;
      }, [imageUrl]);

      useEffect(() => {
        const container = containerRef.current;
        if (!container) return;
        const handleTouchMove = (e) => {
           if (mode !== 'none' && e.cancelable) {
              e.preventDefault();
           }
        };
        container.addEventListener('touchmove', handleTouchMove, { passive: false });
        return () => container.removeEventListener('touchmove', handleTouchMove);
      }, [mode]);

      const saveState = () => {
        const cvs = canvasRef.current;
        historyRef.current.push(ctxRef.current.getImageData(0, 0, cvs.width, cvs.height));
        if (historyRef.current.length > 10) historyRef.current.shift(); 
        setCanUndo(true); 
      };

      const handleUndo = () => {
        if (historyRef.current.length === 0) return;
        const lastState = historyRef.current.pop();
        ctxRef.current.putImageData(lastState, 0, 0);
        setCanUndo(historyRef.current.length > 0);
      };

      const toggleCursor = (visible) => {
          if (!cursorRef.current) return;
          if (visible && (mode === 'eraser' || mode === 'pen')) {
              cursorRef.current.style.opacity = mode === 'pen' ? '0.8' : '1';
          } else {
              cursorRef.current.style.opacity = '0';
          }
      };

      const updateCursorPos = (clientX, clientY) => {
        if ((mode !== 'eraser' && mode !== 'pen') || !cursorRef.current) return;
        cursorRef.current.style.transform = `translate3d(calc(${clientX}px - 50%), calc(${clientY}px - 50%), 0)`;
      };

      const getCanvasPos = (clientX, clientY) => {
        const canvas = canvasRef.current;
        const rect = canvasRectRef.current || canvas.getBoundingClientRect();
        
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;
        
        let dx = clientX - centerX;
        let dy = clientY - centerY;
        
        const rad = -rotation * (Math.PI / 180);
        const rx = dx * Math.cos(rad) - dy * Math.sin(rad);
        const ry = dx * Math.sin(rad) + dy * Math.cos(rad);
        
        const x = rx / exportScale + canvas.width / 2;
        const y = ry / exportScale + canvas.height / 2;
        
        return { x, y, scaleX: 1 / exportScale };
      };

      const startAction = (e) => {
        activePointers.current.set(e.pointerId, e);
        try { e.currentTarget.setPointerCapture(e.pointerId); } catch(err) {}
        setIsInteracting(true); 

        if (activePointers.current.size >= 2) {
            if (isDrawingRef.current) return; 
            const pts = Array.from(activePointers.current.values());
            const dx = pts[1].clientX - pts[0].clientX;
            const dy = pts[1].clientY - pts[0].clientY;
            touchRef.current.dist = Math.hypot(dx, dy);
            touchRef.current.angle = Math.atan2(dy, dx) * (180 / Math.PI); 
            return;
        }

        const pointer = e;
        if (mode === 'scale' || mode === 'rotate') {
            setIsPanning(true);
            panRef.current = { startX: pointer.clientX, startY: pointer.clientY, startPanX: pan.x, startPanY: pan.y };
        } else if (mode === 'eraser' || mode === 'pen') {
            updateCursorPos(pointer.clientX, pointer.clientY);
            toggleCursor(true);
            saveState();
            isDrawingRef.current = true;
            
            canvasRectRef.current = canvasRef.current.getBoundingClientRect();
            const { x, y, scaleX } = getCanvasPos(pointer.clientX, pointer.clientY);
            lastPosRef.current = { x, y };

            const ctx = ctxRef.current;
            const currentSize = (mode === 'eraser' ? eraserSize : penSize) * scaleX;
            ctx.fillStyle = mode === 'eraser' ? '#ffffff' : penColor;
            
            ctx.beginPath();
            ctx.arc(x, y, currentSize / 2, 0, Math.PI * 2);
            ctx.fill();
        }
      };

      const moveAction = (e) => {
        if (!activePointers.current.has(e.pointerId)) return;
        activePointers.current.set(e.pointerId, e);

        if (activePointers.current.size >= 2) {
            if (isDrawingRef.current) return;
            const pts = Array.from(activePointers.current.values());
            const dx = pts[1].clientX - pts[0].clientX;
            const dy = pts[1].clientY - pts[0].clientY;
            const dist = Math.hypot(dx, dy);
            const angle = Math.atan2(dy, dx) * (180 / Math.PI); 

            if (mode === 'scale') {
                if (touchRef.current.dist > 0) {
                    const deltaScale = dist / touchRef.current.dist;
                    setExportScale(prev => Math.min(Math.max(prev * deltaScale, 0.2), 5));
                }
            } else if (mode === 'rotate') {
                if (touchRef.current.angle !== undefined) {
                    let deltaAngle = angle - touchRef.current.angle;
                    if (deltaAngle > 180) deltaAngle -= 360;
                    if (deltaAngle < -180) deltaAngle += 360;
                    setRotation(prev => prev + deltaAngle);
                }
            }

            touchRef.current.dist = dist;
            touchRef.current.angle = angle;
            return;
        }

        const pointer = e;
        if ((mode === 'scale' || mode === 'rotate') && isPanning) {
            const dx = pointer.clientX - panRef.current.startX;
            const dy = pointer.clientY - panRef.current.startY;
            setPan({ x: panRef.current.startPanX + dx, y: panRef.current.startPanY + dy });
        } else if ((mode === 'eraser' || mode === 'pen') && isDrawingRef.current) {
            updateCursorPos(pointer.clientX, pointer.clientY);
            
            const ctx = ctxRef.current;
            const { scaleX } = getCanvasPos(pointer.clientX, pointer.clientY);
            
            ctx.lineWidth = (mode === 'eraser' ? eraserSize : penSize) * scaleX;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = mode === 'eraser' ? '#ffffff' : penColor;
            
            const eventsToProcess = (pointer.nativeEvent && typeof pointer.nativeEvent.getCoalescedEvents === 'function')
                ? pointer.nativeEvent.getCoalescedEvents()
                : [pointer.nativeEvent || pointer];

            ctx.beginPath();
            ctx.moveTo(lastPosRef.current.x, lastPosRef.current.y);
            
            let lastPos = lastPosRef.current;
            for (let i = 0; i < eventsToProcess.length; i++) {
                const ev = eventsToProcess[i];
                const { x, y } = getCanvasPos(ev.clientX, ev.clientY);
                ctx.lineTo(x, y);
                lastPos = { x, y };
            }
            ctx.stroke();
            lastPosRef.current = lastPos;
        }
      };

      const endAction = (e) => {
        if (e && e.pointerId) {
            activePointers.current.delete(e.pointerId);
            try { e.currentTarget.releasePointerCapture(e.pointerId); } catch(err) {}
        } else {
            activePointers.current.clear();
        }

        if (activePointers.current.size === 0) {
            setIsInteracting(false); 
            if (isPanning) setIsPanning(false);
            if (isDrawingRef.current) {
                isDrawingRef.current = false;
                if (ctxRef.current) ctxRef.current.beginPath();
            }
            touchRef.current.dist = 0;
            canvasRectRef.current = null; 
        }
      };

      const handleWheel = (e) => {
        if (mode === 'scale') {
           e.preventDefault();
           const delta = e.deltaY > 0 ? 0.95 : 1.05;
           setExportScale(prev => Math.min(Math.max(prev * delta, 0.2), 5));
        } else if (mode === 'rotate') {
           e.preventDefault();
           const deltaAngle = e.deltaY > 0 ? -2 : 2; 
           setRotation(prev => prev + deltaAngle);
        }
      };

      const handleAutoResize = async () => {
        if (isOcrLoading) return;
        if (!window.Tesseract) {
            showAlert('Tesseract.js OCR 引擎尚未載入完成，請稍候再試。');
            return;
        }
        setIsOcrLoading(true);
        setOcrProgress('正在初始化 AI 視覺掃描引擎...');
        try {
            const rawCanvas = document.createElement('canvas');
            rawCanvas.width = canvasDim.w;
            rawCanvas.height = canvasDim.h;
            const ctx = rawCanvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvasDim.w, canvasDim.h);
            ctx.drawImage(canvasRef.current, 0, 0);
            const dataUrl = rawCanvas.toDataURL('image/jpeg');

            setOcrProgress('正在準備繁體中文辨識模型\n(初次載入可能需要 5-10 秒下載，請稍候)...');

            const worker = await window.Tesseract.createWorker('chi_tra', 1, {
                logger: m => {
                    if (m.status === 'recognizing text') {
                        setOcrProgress(`正在深度掃描並分析字體大小... ${Math.round(m.progress * 100)}%`);
                    } else if (m.status && m.progress) {
                        setOcrProgress(`引擎模型準備中...\n(${m.status}: ${Math.round(m.progress * 100)}%)`);
                    }
                }
            });
            
            const ret = await worker.recognize(dataUrl);
            await worker.terminate();

            const symbols = ret.data.symbols || [];
            if (symbols.length === 0) {
                showAlert('分析失敗：在圖片中找不到足夠清晰的文字！');
                setIsOcrLoading(false);
                return;
            }

            let validHeights = [];
            for (const sym of symbols) {
                const text = sym.text ? sym.text.trim() : '';
                if (text && text.match(/[\u4e00-\u9fa5]/)) {
                    const w = sym.bbox.x1 - sym.bbox.x0;
                    const h = sym.bbox.y1 - sym.bbox.y0;
                    if (h < 10 || h > canvasDim.h * 0.3) continue;
                    const ratio = w / h;
                    if (ratio > 0.7 && ratio < 1.3) validHeights.push(h);
                }
            }

            if (validHeights.length < 3) {
                for (const sym of symbols) {
                    const w = sym.bbox.x1 - sym.bbox.x0;
                    const h = sym.bbox.y1 - sym.bbox.y0;
                    if (h < 10 || h > canvasDim.h * 0.3) continue;
                    const ratio = w / h;
                    if (ratio > 0.7 && ratio < 1.3) validHeights.push(h);
                }
            }
            
            if (validHeights.length === 0) {
                 showAlert('分析失敗：找不到適合評估尺寸的文字特徵！');
                 setIsOcrLoading(false);
                 return;
            }

            validHeights.sort((a,b) => a-b);
            const q1 = validHeights[Math.floor((validHeights.length / 4))];
            const q3 = validHeights[Math.floor((validHeights.length * (3 / 4)))];
            const iqr = q3 - q1;
            const lowerBound = q1 - 1.5 * iqr;
            const upperBound = q3 + 1.5 * iqr;
            
            const filteredHeights = validHeights.filter(h => h >= lowerBound && h <= upperBound);
            const finalHeights = filteredHeights.length > 0 ? filteredHeights : validHeights;
            const sum = finalHeights.reduce((a, b) => a + b, 0);
            const representativeHeight = sum / finalHeights.length;

            const TARGET_TEXT_HEIGHT = 13; 
            const newScale = TARGET_TEXT_HEIGHT / representativeHeight;

            setExportScale(Math.min(Math.max(newScale, 0.2), 5));
            setMode('scale');
            
        } catch (e) {
            console.error(e);
            showAlert('自動辨識縮放發生錯誤：' + e.message);
        }
        setIsOcrLoading(false);
      };

      const handleComplete = () => {
        const canvas = canvasRef.current;
        const finalCanvas = document.createElement('canvas');
        
        const rad = rotation * Math.PI / 180;
        const absCos = Math.abs(Math.cos(rad));
        const absSin = Math.abs(Math.sin(rad));
        
        const baseW = canvas.width * exportScale;
        const baseH = canvas.height * exportScale;
        
        const TARGET_PRINT_WIDTH = 2000; 
        let resolutionMultiplier = TARGET_PRINT_WIDTH / baseW;
        resolutionMultiplier = Math.max(1.5, Math.min(resolutionMultiplier, 4));
        
        const w = baseW * resolutionMultiplier;
        const h = baseH * resolutionMultiplier;
        
        let finalW = w * absCos + h * absSin;
        let finalH = w * absSin + h * absCos;
        
        const MAX_AREA = 12000000;
        let scaleDown = 1;
        if (finalW * finalH > MAX_AREA) {
           scaleDown = Math.sqrt(MAX_AREA / (finalW * finalH));
           finalW *= scaleDown;
           finalH *= scaleDown;
        }
        
        finalCanvas.width = finalW;
        finalCanvas.height = finalH;
        
        const ctx = finalCanvas.getContext('2d');
        
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, finalW, finalH);

        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        
        ctx.translate(finalW / 2, finalH / 2);
        ctx.rotate(rad);
        ctx.scale(scaleDown, scaleDown);
        ctx.drawImage(canvas, -w / 2, -h / 2, w, h);
        
        const baseBoundingW = baseW * absCos + baseH * absSin;
        
        let outDataUrl = finalCanvas.toDataURL('image/webp', 0.85);
        if (outDataUrl.startsWith('data:image/png') || outDataUrl === 'data:,') {
            outDataUrl = finalCanvas.toDataURL('image/jpeg', 0.85);
        }
        
        onComplete(outDataUrl, baseBoundingW);
      };

      const handleRemoveColoredPen = () => {
        setShowSizePicker(false);
        setShowPenPicker(false);

        const canvas = canvasRef.current, ctx = ctxRef.current || canvas.getContext('2d');
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height), data = imgData.data;
        
        for (let i = 0; i < data.length; i += 4) {
          const r = data[i], g = data[i+1], b = data[i+2];
          const max = Math.max(r, g, b), min = Math.min(r, g, b);
          const diff = max - min;
          const isYellowishPaper = r > 160 && g > 150 && b < r - 20;
          if (diff > 30 && !isYellowishPaper) {
            data[i] = 255; data[i+1] = 255; data[i+2] = 255;
          }
        }
        ctx.putImageData(imgData, 0, 0);
      };

        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height), data = imgData.data;
        
        for (let i = 0; i < data.length; i += 4) {
          const lum = 0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2];
          if (lum > 110) { 
            data[i] = 255; data[i+1] = 255; data[i+2] = 255; 
          } else if (lum < 70) {
            data[i] = 0; data[i+1] = 0; data[i+2] = 0; 
          } else {
            const val = (lum - 70) * (255 / 40);
            data[i] = val; data[i+1] = val; data[i+2] = val;
          }
        }
        ctx.putImageData(imgData, 0, 0);
      };

      const handleRemoveBackground = () => {

        for (let i = 0; i < data.length; i += 4) {
          const luminance = 0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2];
          if (luminance > threshold) {
            data[i] = 255; data[i+1] = 255; data[i+2] = 255;
          } else {
            data[i] = Math.max(0, data[i] - 40); data[i+1] = Math.max(0, data[i+1] - 40); data[i+2] = Math.max(0, data[i+2] - 40);
          }
        }
        ctx.putImageData(imgData, 0, 0);

            <canvas ref={canvasRef}

                     {mode === 'scale' ? (

          </div>

          <div className="relative">

              if (currentUser) {
                  try {
                      // 讀取最新的雲端知識點
                      const kpRef = fbDb.collection(db, 'artifacts', appId, 'public', 'data', 'knowledge_points');
                      const kpSnap = await fbDb.getDocs(kpRef);
                      const kps = kpSnap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                      setKnowledgePoints(kps);
                  } catch (e) {
                      console.error("載入知識點失敗:", e);
                  }
              }
              setIsDbLoading(false);
            });

          } catch (e) {
            setDbError("加載 Firebase 模組失敗：" + e.message);
            setIsDbLoading(false);
          }
        };
        loadFirebase();
      }, [fbConfig]);

      useEffect(() => {
        const savedKey = localStorage.getItem('poppinsApiKey');
        if (savedKey) setApiKey(savedKey);
      }, []);

      const handleFbConfigSave = (config) => {
          localStorage.setItem('poppinsFbConfig', JSON.stringify(config));
          setFbConfig(config);
      };

      const handleLogin = (key, profile) => {
        setApiKey(key);
        setCurrentProfile(profile);
        setCurrentView('dashboard');
      };

      const logout = () => { setCurrentProfile(''); setCurrentView('login'); };
      const resetFbConfig = () => { localStorage.removeItem('poppinsFbConfig'); setFbConfig(null); setFB(null); setUser(null); setCurrentView('login'); };

      const handleImageSelected = (dataUrl) => {
        setRawImage(dataUrl);
        setEditTargetId(null);
        setIsEditingExisting(false);
        setPrintWidth(null);
        setCurrentView('crop');
      };

      const handleFullEdit = (item) => {
        setEditTargetId(item.id);
        const created_date = item.created_date || getDateStr(item.timestamp || Date.now());
        const chapter = item.chapter || (item.volume ? `${item.volume} - ${item.sub_subject}` : item.sub_subject) || '';
        
        // ★ 處理舊資料轉換為新的 points 陣列
        let initPoints = item.points ? [...item.points] : [];
        if (initPoints.length === 0 && (item.concept || item.point_name)) {
            initPoints.push({
                point_id: item.point_id || '',
                point_name: item.point_name || item.concept,
                page: item.page || ''
            });
        }
        // 補滿 3 個
        while(initPoints.length < 3) initPoints.push({point_id: '', point_name: '', page: ''});

        setAiAnalysis({ ...item, chapter, points: initPoints, created_date }); 
        setEditedImage(item.image);
        setPrintWidth(item.printWidth || null);
        setIsEditingExisting(true);
        setCurrentView('form');
      };

      const callGeminiAI = async (base64Image) => {
        setLoadingMsg('AI 老師正在進行分析與教學中...');
        setCurrentView('classify');
        
        try {
          const base64Data = base64Image.split(',')[1];
          // 壓縮知識點以放入 Prompt
          const condensedKPs = knowledgePoints.map(kp => ({
              subj: kp.subject, chap: kp.chapter, id: kp.point_id, name: kp.point_name, pg: kp.page
          }));
          const dbStr = JSON.stringify(condensedKPs);
          
          const prompt = `你是一個台灣國中教育會考的頂尖專家老師。請仔細閱讀這張錯題圖片，找出這題真正在考的觀念。
          
          這是最新的雲端知識點資料庫 (包含科目、章節、知識點編號、知識點名稱與大滿貫講義頁碼)：
          ${dbStr}

          請務必只回傳一個 JSON 格式的物件，不要包含其他文字說明或 Markdown 語法。
          
          1. 📍【分類判斷】：仔細看題目，這題考了哪幾個核心知識點？(一個考題可能混合 1 到 3 個核心知識)。
              - 請在上方資料庫中進行檢索，找出最吻合的知識點。
              - 如果資料庫中找不到完全對應的，請自行推斷科目與章節，並將 point_id 和 page 留空字串。
          
          2. 【極致防呆】幾何與代數的嚴格區分：若題目出現幾何特徵，【絕對不可】分類至代數單元。
          
          3. "ai_tutor": 這是「AI老師教學」欄位。⚠️【超級強制要求】：
              - 對象是「基礎較弱的台灣國中生」，使用【最簡單、最直白、最簡短】的口吻！
              - 嚴格分段，加上 Emoji 作為標題開頭（如：💡 核心觀念、🛠️ 解題步驟、✅ 結論）。
              - 解析教學的最後，請提供題目的答案。
              - 並且在解析的最後，可以親切地提醒學生去翻閱大滿貫講義的對應頁碼。
          
          4. 【最重要：數學與化學式排版】所有數學式、化學式、方程式、變數符號都必須使用 LaTeX 語法包裝！行內用單錢字號 $，獨立行用雙錢字號 $$。
              - ⚠️【JSON 格式防呆】：因為回傳 JSON，所有的 LaTeX 反斜線 (backslash) 都「必須」加上跳脫字元變成雙反斜線 (例如 \\frac, \\times)！
          
          JSON 格式必須嚴格依照如下 (最多輸出3個 points)：
          {
            "subject": "科目名稱",
            "chapter": "章節名稱",
            "points": [
              {
                 "point_id": "知識點編號 (例: 1-01)",
                 "point_name": "知識點名稱",
                 "page": "講義頁碼 (數字)"
              }
            ],
            "ai_tutor": "教學解析內容"
          }`;

          const modelsRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`);
          if (!modelsRes.ok) throw new Error('無法取得模型清單，請確認 API Key 是否有效。');
          const modelsData = await modelsRes.json();
          const availableModels = modelsData.models ? modelsData.models.map(m => m.name.replace('models/', '')) : [];

          const preferredModels = ['gemini-2.5-flash', 'gemini-1.5-flash', 'gemini-1.5-flash-latest', 'gemini-1.5-pro'];
          let modelsToTry = preferredModels.filter(m => availableModels.includes(m));
          if (modelsToTry.length === 0) modelsToTry = availableModels.filter(m => m.includes('gemini') && (m.includes('flash') || m.includes('pro')));
          if (modelsToTry.length === 0) throw new Error('您的 API Key 沒有權限使用影像分析模型。');

          let successData = null;
          let lastErrorMsg = '';

          for (const targetModel of modelsToTry) {
            if (successData) break;
            const maxRetries = 2; 
            let delay = 2000; 

            for (let attempt = 1; attempt <= maxRetries; attempt++) {
              setLoadingMsg(`AI 老師分析教學中...\n(模型: ${targetModel})`);
              try {
                const isOldVision = targetModel.includes('vision');
                const bodyPayload = { contents: [{ parts: [{ text: prompt }, { inlineData: { mimeType: "image/jpeg", data: base64Data } }] }] };
                if (!isOldVision) bodyPayload.generationConfig = { responseMimeType: "application/json" };

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${targetModel}:generateContent?key=${apiKey}`, {
                  method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(bodyPayload)
                });

                if (response.ok) {
                  successData = await response.json(); break; 
                } else {
                  const errData = await response.json().catch(() => ({}));
                  lastErrorMsg = errData.error?.message || `模型 ${targetModel} 回傳未知錯誤`;
                  if (response.status === 503 || response.status === 429) {
                    if (attempt < maxRetries) { await new Promise(res => setTimeout(res, delay)); delay *= 2; continue; }
                  } else break;
                }
              } catch (e) {
                 lastErrorMsg = e.message;
                 if (attempt < maxRetries) { await new Promise(res => setTimeout(res, delay)); delay *= 2; }
              }
            } 
          } 

          if (!successData) throw new Error(`分析失敗：${lastErrorMsg}`);

          const aiResponseText = successData.candidates?.[0]?.content?.parts?.[0]?.text;
          
          if (aiResponseText) {
            let parsed = { subject: '國文', chapter: '', points: [], ai_tutor: '' };
            try {
               let cleanedText = aiResponseText.replace(/```json/g, '').replace(/```/g, '').trim();
               cleanedText = cleanedText.replace(/\\\\n/g, '\\n')
                                        .replace(/(?<!\\)\\times/g, '\\\\times')
                                        .replace(/(?<!\\)\\text/g, '\\\\text')
                                        .replace(/(?<!\\)\\frac/g, '\\\\frac')
                                        .replace(/(?<!\\)\\Delta/g, '\\\\Delta')
                                        .replace(/(?<!\\)\\pm/g, '\\\\pm')
                                        .replace(/(?<!\\)\\sqrt/g, '\\\\sqrt')
                                        .replace(/(?<!\\)\\rightarrow/g, '\\\\rightarrow');
               parsed = JSON.parse(cleanedText);
            } catch (e) { console.error("JSON Parse Error:", e, aiResponseText); }
            
            // ★ 將 parsed 的 points 轉換為固定長度為 3 的陣列
            let newPoints = parsed.points && Array.isArray(parsed.points) ? parsed.points : [];
            while(newPoints.length < 3) newPoints.push({point_id: '', point_name: '', page: ''});
            // 只取前 3 個
            newPoints = newPoints.slice(0, 3);

            setAiAnalysis({
              subject: parsed.subject || '國文',
              chapter: parsed.chapter || '',
              points: newPoints,
              ai_tutor: parsed.ai_tutor || '',
              created_date: getTodayStr()
            });
          }
        } catch (error) {
          console.error(error);
          showAlert('AI 分析失敗：\n' + error.message + '\n\n您可以先手動輸入分類。');
          setAiAnalysis({ subject: '國文', chapter: '', points: [{point_id:'', point_name:'', page:''},{point_id:'', point_name:'', page:''},{point_id:'', point_name:'', page:''}], ai_tutor: '', created_date: getTodayStr() });
        }
        
        setLoadingMsg('');
        setCurrentView('form');
      };

      const saveMistake = async (formData) => {
        if (!user || !FB) return showAlert('尚未連線至雲端資料庫，無法儲存。');
        setLoadingMsg('正在同步至雲端資料庫...');
        setCurrentView('classify');

        try {
          // 清理空知識點，避免存入無用資料
          const cleanedPoints = formData.points.map(p => ({
              point_id: p.point_id || '',
              point_name: p.point_name || '',
              page: p.page || ''
          }));

          const payload = {
              ...formData,
              points: cleanedPoints,
              image: editedImage || croppedImage,
              printWidth: printWidth !== null ? printWidth : (aiAnalysis.printWidth || null),
              updated_at: Date.now()
          };
          
          if (!editTargetId) payload.timestamp = Date.now();

          if (editTargetId) {
             await FB.updateDoc(FB.doc(FB.db, 'artifacts', FB.appId, 'public', 'data', `mistakes_${currentProfile}`, editTargetId), payload);
             setLoadingMsg(''); showAlert('更新成功！已安全同步至雲端。'); setCurrentView('list');
          } else {
             const colRef = FB.collection(FB.db, 'artifacts', FB.appId, 'public', 'data', `mistakes_${currentProfile}`);
             await FB.addDoc(colRef, payload);
             setLoadingMsg(''); showAlert('儲存成功！已安全同步至雲端。'); setCurrentView('dashboard');
          }
        } catch (e) {
          setLoadingMsg(''); showAlert('雲端儲存失敗：' + e.message); setCurrentView('form');
        }
      };

      if (!fbConfig) return <FbSetupView onSave={handleFbConfigSave} />;
      if (isDbLoading) return <LoadingView message="正在連線至雲端資料庫..." />;
      if (dbError) {
        return (
            <div className="min-h-screen font-sans text-gray-800 bg-[#fffbeb] flex items-center justify-center p-6">
               <div className="bg-white p-8 rounded-2xl shadow-xl max-w-lg text-center border-t-4 border-red-500">
                   <h2 className="text-2xl font-bold text-red-600 mb-4">資料庫連線失敗</h2>
                   <p className="text-gray-600 mb-6">{dbError}</p>
                   <button onClick={() => setFbConfig(null)} className="px-6 py-2 bg-gray-200 rounded-lg text-gray-700 font-bold hover:bg-gray-300">重新設定 Firebase</button>
               </div>
            </div>
        );
      }

      return (
        <div className="min-h-screen font-sans text-gray-800" style={{ backgroundColor: THEME.bg }}>
          {currentView === 'login' && <LoginView onLogin={handleLogin} onResetFb={() => {
              const { showConfirm } = useModal(); 
              resetFbConfig();
          }} savedKey={apiKey} />}
          {currentView === 'dashboard' && <DashboardView currentProfile={currentProfile} onSelectImage={handleImageSelected} onGoList={() => setCurrentView('list')} onLogout={logout} isDbConnected={user && FB} />}
          {currentView === 'crop' && <CropView imageUrl={rawImage} onCancel={() => setCurrentView('dashboard')} onComplete={(cropped) => { setCroppedImage(cropped); setCurrentView('edit'); }} onUpdateRawImage={setRawImage} />}
          {currentView === 'edit' && <EditView imageUrl={isEditingExisting ? editedImage : croppedImage} onCancel={() => { if(isEditingExisting) setCurrentView('form'); else setCurrentView('crop'); }} onComplete={(edited, baseW) => { setEditedImage(edited); if(baseW) setPrintWidth(baseW); if(!isEditingExisting) { callGeminiAI(edited); } else { setCurrentView('form'); } }} />}
          {currentView === 'classify' && <LoadingView message={loadingMsg} />}
          {currentView === 'form' && <FormView initialData={aiAnalysis} image={editedImage} knowledgePoints={knowledgePoints} onReEditImage={() => setCurrentView('edit')} onCancel={() => { if(isEditingExisting) setCurrentView('list'); else setCurrentView('edit'); }} onSave={saveMistake} />}
          {currentView === 'list' && <ListView currentProfile={currentProfile} knowledgePoints={knowledgePoints} onBack={() => setCurrentView('dashboard')} FB={FB} user={user} isDbConnected={user && FB} onFullEdit={handleFullEdit} />}
        </div>
      );
    }

    function FbSetupView({ onSave }) {
        const [input, setInput] = useState('');
        const [error, setError] = useState('');
        const handleSave = () => {
            try {
                let cleanConfig = input.trim();
                if (!cleanConfig) throw new Error("請勿空白");
                const match = cleanConfig.match(/\{[\s\S]*\}/);
                if (match) cleanConfig = match[0];
                cleanConfig = cleanConfig.replace(/([{,]\s*)([a-zA-Z0-9_]+)\s*:/g, '$1"$2":').replace(/'/g, '"').replace(/,\s*}/g, '}');
                const configObj = JSON.parse(cleanConfig);
                if (!configObj.apiKey || !configObj.projectId) throw new Error("缺少必要欄位 (apiKey, projectId)，請確認您貼上的是正確的 firebaseConfig 物件。");
                onSave(configObj);
            } catch (e) { setError("解析失敗，請確認格式正確。\n" + e.message); }
        };
        return (
            <div className="flex flex-col items-center justify-center min-h-screen p-6 bg-[#fffbeb]">
              <div className="bg-white rounded-3xl shadow-xl p-10 w-full max-w-lg text-center">
                 <div className="bg-[#f59e0b] text-[#ffffff] p-5 rounded-2xl inline-block mb-6 shadow-md"><Icons.Settings /></div>
                 <h1 className="text-4xl font-bold mb-5 text-[#b45309]">⚙️ 雲端資料庫設定</h1>
                 <p className="text-gray-600 mb-6 text-base text-left leading-relaxed">
                   歡迎使用！為了啟用跨裝置雲端同步功能，請將您的 <strong>Firebase 專案設定 (firebaseConfig)</strong> 貼在下方。
                 </p>
                 <textarea
                    className="w-full p-5 border border-gray-200 rounded-xl bg-gray-50 focus:outline-none focus:ring-2 focus:ring-[#f59e0b] text-base font-mono h-48 mb-5 shadow-inner"
                    placeholder={`{\n  "apiKey": "AIzaSy...",\n  "authDomain": "...",\n  "projectId": "...",\n  "storageBucket": "...",\n  "messagingSenderId": "...",\n  "appId": "..."\n}`}
                    value={input} onChange={(e) => setInput(e.target.value)}
                 />
                 {error && <div className="text-red-500 text-base mb-5 text-left whitespace-pre-wrap font-bold bg-red-50 p-4 rounded-lg border border-red-100">{error}</div>}
                 <button onClick={handleSave} className="w-full bg-[#f59e0b] text-[#ffffff] py-4 rounded-xl font-bold text-xl shadow-lg hover:bg-[#d97706] transition-colors flex justify-center items-center gap-2">
                    💾 儲存設定並繼續
                 </button>
              </div>
            </div>
        );
    }

    function LoginView({ onLogin, onResetFb, savedKey }) {
      const { showAlert, showConfirm } = useModal();
      const [inputKey, setInputKey] = useState(savedKey || '');
      const [showKey, setShowKey] = useState(false);
      const [inputProfile, setInputProfile] = useState('');
      const [profiles, setProfiles] = useState(() => {
        const saved = localStorage.getItem('poppinsProfiles');
        return saved ? JSON.parse(saved) : [];
      });

      const handleQuickLogin = (profile) => {
        if (!inputKey.trim()) return showAlert('請先輸入或確認 Gemini API Key');
        localStorage.setItem('poppinsApiKey', inputKey.trim());
        onLogin(inputKey.trim(), profile);
      };

      const handleNewLogin = () => {
        if (!inputKey.trim()) return showAlert('請輸入有效的 Gemini API Key');
        const cleanProfile = inputProfile.trim().replace(/[\/\\.#$\[\]]/g, '');
        if (!cleanProfile) return showAlert('請輸入有效的使用者名稱 (不可包含特殊符號)');
        
        const newProfiles = [...new Set([...profiles, cleanProfile])];
        localStorage.setItem('poppinsProfiles', JSON.stringify(newProfiles));
        setProfiles(newProfiles);
        localStorage.setItem('poppinsApiKey', inputKey.trim());
        onLogin(inputKey.trim(), cleanProfile);
      };

      const removeProfile = (profile, e) => {
        e.stopPropagation();
        showConfirm(`真的確定要移除「${profile}」的快速登入嗎？`, () => {
            const newProfiles = profiles.filter(p => p !== profile);
            localStorage.setItem('poppinsProfiles', JSON.stringify(newProfiles));
            setProfiles(newProfiles);
        });
      };

      return (
        <div className="flex flex-col items-center justify-center min-h-screen p-6">
          <div className="bg-white rounded-3xl shadow-xl p-8 w-full max-w-lg text-center border-t-[6px] border-[#f59e0b]">
            <h1 className="text-4xl font-bold mb-8 text-[#b45309] flex justify-center items-center gap-3">🏆 2027 決戰會考</h1>
            <div className="mb-6 bg-amber-50 p-5 rounded-2xl border border-amber-100 text-left">
               <label className="block text-base font-bold text-[#b45309] mb-3">🔑 確認 API 金鑰</label>
               <div className="relative">
                 <input type={showKey ? "text" : "password"} placeholder="請輸入 Gemini API Key" className="w-full p-4 pr-12 border border-gray-200 rounded-xl bg-white focus:outline-none focus:ring-2 focus:ring-[#f59e0b] text-base shadow-inner" value={inputKey} onChange={(e) => setInputKey(e.target.value)} />
                 <button type="button" onClick={() => setShowKey(!showKey)} className="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-amber-500 transition-colors">{showKey ? <Icons.EyeOff /> : <Icons.Eye />}</button>
               </div>
            </div>
            <div className="mb-8 bg-gray-50 p-5 rounded-2xl border border-gray-100 text-left">
               <label className="block text-base font-bold text-gray-700 mb-4">👤 選擇或新增使用者</label>
               {profiles.length > 0 && (
                  <div className="flex gap-4 overflow-x-auto pb-4 mb-4 border-b border-gray-200 scrollbar-hide">
                    {profiles.map(p => (
                       <div key={p} className="relative group flex-shrink-0 pt-2 pr-2">
                         <button onClick={() => handleQuickLogin(p)} className="flex flex-col items-center gap-3 w-24">
                           <div className="w-20 h-20 rounded-full bg-[#f59e0b] text-[#ffffff] flex items-center justify-center text-4xl font-bold shadow-sm group-hover:scale-105 transition-transform border-4 border-white">{p.substring(0, 1)}</div>
                           <span className="text-base font-bold text-gray-600 truncate w-full text-center px-1">{p}</span>
                         </button>
                         <button onClick={(e) => removeProfile(p, e)} className="absolute top-0 right-0 bg-white rounded-full text-gray-400 hover:text-white hover:bg-red-500 shadow-md border border-gray-200 md:hidden group-hover:flex transition-all p-1.5 z-10"><Icons.Close /></button>
                       </div>
                    ))}
                  </div>
               )}
               <div className="flex gap-3">
                  <input value={inputProfile} onChange={(e) => setInputProfile(e.target.value)} className="flex-grow p-4 border border-gray-200 rounded-xl bg-white focus:outline-none focus:ring-2 focus:ring-[#f59e0b] text-base shadow-inner" placeholder="輸入新使用者名稱..." onKeyDown={(e) => e.key === 'Enter' && handleNewLogin()} />
                  <button onClick={handleNewLogin} className="bg-[#f59e0b] text-[#ffffff] px-6 rounded-xl font-bold text-base shadow hover:bg-[#d97706] transition-colors whitespace-nowrap">🚀 登入</button>
               </div>
            </div>
            <button onClick={onResetFb} className="text-sm text-gray-400 hover:text-red-500 underline transition-colors">🗑️ 清除並重新設定 Firebase 資料庫</button>
          </div>
        </div>
      );
    }

    function DashboardView({ currentProfile, onSelectImage, onGoList, onLogout, isDbConnected }) {
      const fileInputRef = useRef(null);
      const handleFileChange = (e) => {
        const file = e.target.files[0];
        if (file) { const reader = new FileReader(); reader.onload = (e) => onSelectImage(e.target.result); reader.readAsDataURL(file); }
      };
      return (
        <div className="min-h-screen flex flex-col p-4 md:p-6 w-[98%] max-w-[1400px] mx-auto">
          <header className="flex justify-between items-center mb-12 py-4">
            <div className="flex items-center gap-3">
              <div className="bg-[#f59e0b] text-[#ffffff] p-3 rounded-lg"><Icons.Book /></div>
              <span className="font-bold text-[#b45309] text-2xl hidden sm:block">🏆 2027 決戰會考</span>
              <div className="flex items-center gap-2 bg-white px-3 py-1.5 rounded-full border border-gray-200 shadow-sm ml-2">
                <Icons.StatusDot color={isDbConnected ? "#22c55e" : "#ef4444"} />
                <span className="text-sm font-bold text-gray-600">{isDbConnected ? '已連線 🟢' : '未連線 🔴'}</span>
              </div>
            </div>
            <div className="flex items-center gap-4">
              <button onClick={onLogout} className="text-base font-bold text-gray-500 hover:text-gray-800 transition-colors">🚪 登出 / 切換</button>
            </div>
          </header>
          <main className="flex-grow flex flex-col items-center justify-center text-center">
             <div className="w-24 h-24 rounded-full bg-[#f59e0b] text-[#ffffff] flex items-center justify-center text-5xl font-bold shadow-md mb-8 border-4 border-white">{currentProfile.charAt(0)}</div>
             <h1 className="text-5xl font-bold mb-6 text-gray-800 tracking-wide">👋 嗨，{currentProfile}！</h1>
             <p className="text-gray-500 mb-12 text-xl tracking-widest">🌟 今天的努力，是為了遇見更好的自己。</p>
