    function FormView({ initialData, image, knowledgePoints, onCancel, onSave, onReEditImage }) {
      const availableSubjects = useMemo(() => {
        const subjs = new Set(knowledgePoints.map(kp => kp.subject));
        if (subjs.size === 0) return SUBJECT_ORDER; 
        return Array.from(subjs);
      }, [knowledgePoints]);

      const [formData, setFormData] = useState({
        subject: availableSubjects.includes(initialData.subject) ? initialData.subject : availableSubjects[0] || '生物',
        chapter: initialData.chapter || '',
        points: initialData.points || [
          {point_id: '', point_name: '', page: ''},
          {point_id: '', point_name: '', page: ''},
          {point_id: '', point_name: '', page: ''}
        ],
        notes: initialData.notes || '',
        answer: initialData.answer || '',
        ai_tutor: initialData.ai_tutor || '',
        mastery: initialData.mastery || 'need_review',
        created_date: initialData.created_date || getTodayStr()
      });

      const [showTutorPreview, setShowTutorPreview] = useState(false);

      const availableChapters = useMemo(() => {
         const chaps = new Set(knowledgePoints.filter(kp => kp.subject === formData.subject).map(kp => kp.chapter));
         return Array.from(chaps);
      }, [knowledgePoints, formData.subject]);

      const availablePointsForSelect = useMemo(() => {
         return knowledgePoints.filter(kp => kp.subject === formData.subject && (!formData.chapter || kp.chapter === formData.chapter));
      }, [knowledgePoints, formData.subject, formData.chapter]);

      const handleSubjectChange = (e) => {
        const newSubj = e.target.value;
        setFormData({ ...formData, subject: newSubj, chapter: '' });
      };

      const handlePointSelect = (idx, selectedPointId) => {
         const matchedPt = availablePointsForSelect.find(p => p.point_id === selectedPointId);
         const newPoints = [...formData.points];
         if (matchedPt) {
             newPoints[idx] = { point_id: matchedPt.point_id, point_name: matchedPt.point_name, page: matchedPt.page };
         } else {
             newPoints[idx] = { ...newPoints[idx], point_id: selectedPointId };
         }
         setFormData({...formData, points: newPoints});
      };

      const handlePointInput = (idx, field, value) => {
         const newPoints = [...formData.points];
         newPoints[idx][field] = value;
         setFormData({...formData, points: newPoints});
      };

      return (
        <div className="fixed inset-0 bg-gray-50 overflow-y-auto pb-20">
          <div className="bg-white p-5 shadow-sm sticky top-0 flex justify-between items-center z-10">
            <button onClick={onCancel} className="p-2 text-gray-500 hover:text-gray-800 transition-colors"><Icons.ArrowLeft /></button>
            <span className="font-bold text-xl text-gray-800">💾 確認並儲存</span>
            <button onClick={() => onSave(formData)} className="px-6 py-2.5 bg-[#f59e0b] hover:bg-[#d97706] transition-colors text-[#ffffff] rounded-lg font-bold text-lg flex items-center gap-2"><Icons.Cloud /> ☁️ 同步</button>
          </div>

          <div className="p-4 md:p-6 w-[98%] max-w-[1000px] mx-auto space-y-6">
            <div className="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 relative group">
               <img src={image} alt="Processed" className="w-full object-contain rounded-lg max-h-[400px] border border-gray-200 mx-auto" />
               <div className="absolute inset-0 flex items-center justify-center bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity rounded-2xl">
                  <button onClick={onReEditImage} className="bg-white text-gray-800 px-6 py-3 rounded-xl font-bold text-lg shadow-lg flex items-center gap-2 hover:bg-gray-100 transition-colors"><Icons.Edit /> 重新編輯影像</button>
               </div>
            </div>

            <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 space-y-6">
              <div className="flex justify-between items-center mb-2">
                 <div className="flex items-center gap-2 text-xl"><Icons.Wand /> <span className="font-bold text-[#b45309]">🤖 AI 分類結果 (可手動修改)</span></div>
              </div>

              <div>
                <label className="block text-base font-bold text-gray-700 mb-2">⭐ 熟練度標記</label>
                <div className="flex gap-4">
                   <label className={`flex-1 flex items-center justify-center gap-2 p-4 rounded-xl border-2 cursor-pointer transition-all ${formData.mastery === 'need_review' ? 'border-red-400 bg-red-50' : 'border-gray-200 bg-gray-50'}`}>
                      <input type="radio" name="mastery" value="need_review" className="hidden" checked={formData.mastery === 'need_review'} onChange={(e) => setFormData({...formData, mastery: e.target.value})} />
                      <span className="text-2xl">🔴</span><span className="font-bold text-gray-700 text-lg">需再複習</span>
                   </label>
                   <label className={`flex-1 flex items-center justify-center gap-2 p-4 rounded-xl border-2 cursor-pointer transition-all ${formData.mastery === 'mastered' ? 'border-green-500 bg-green-50' : 'border-gray-200 bg-gray-50'}`}>
                      <input type="radio" name="mastery" value="mastered" className="hidden" checked={formData.mastery === 'mastered'} onChange={(e) => setFormData({...formData, mastery: e.target.value})} />
                      <span className="text-2xl">🟢</span><span className="font-bold text-gray-700 text-lg">已掌握</span>
                   </label>
                </div>
              </div>
              
              <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                  <div>
                    <label className="block text-base font-bold text-gray-700 mb-2 flex items-center gap-2"><Icons.Calendar /> 建檔日期</label>
                    <input type="date" className="w-full p-4 text-lg border border-gray-300 rounded-xl bg-gray-50 focus:ring-2 focus:ring-[#f59e0b] outline-none text-gray-700 font-bold" value={formData.created_date} onChange={e => setFormData({...formData, created_date: e.target.value})} />
                  </div>
                  <div>
                    <label className="block text-base font-bold text-gray-700 mb-2">科目</label>
                    <select className="w-full p-4 text-lg border border-gray-300 rounded-xl bg-gray-50 focus:ring-2 focus:ring-[#f59e0b] outline-none" value={formData.subject} onChange={handleSubjectChange}>
                      {availableSubjects.map(s => <option key={s} value={s}>{s}</option>)}
                    </select>
                  </div>
              </div>

              <div>
                  <label className="block text-base font-bold text-gray-700 mb-2">章節</label>
                  {availableChapters.length > 0 ? (
                      <select className="w-full p-4 text-lg border border-gray-300 rounded-xl bg-gray-50 focus:ring-2 focus:ring-[#f59e0b] outline-none" value={formData.chapter} onChange={e => setFormData({...formData, chapter: e.target.value})}>
                        <option value="">-- 請選擇章節 (可選) --</option>
                        {availableChapters.map(c => <option key={c} value={c}>{c}</option>)}
                      </select>
                  ) : (
                      <input className="w-full p-4 text-lg border border-gray-300 rounded-xl bg-gray-50 focus:ring-2 focus:ring-[#f59e0b] outline-none" value={formData.chapter} onChange={e => setFormData({...formData, chapter: e.target.value})} placeholder="例如: ch1 科學方法..." />
                  )}
              </div>

              {/* 多重知識點區塊 */}
              <div className="pt-2">
                 <label className="block text-lg font-bold text-[#b45309] mb-4 border-b border-amber-200 pb-2">🎯 選擇此題測驗的核心知識點 (最多3個)</label>
                 <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                     {[0, 1, 2].map((idx) => (
                        <div key={idx} className={`bg-amber-50/50 p-4 rounded-xl border ${formData.points[idx].point_name ? 'border-amber-400 shadow-sm bg-amber-50' : 'border-amber-100'} transition-all`}>
                           <div className="flex justify-between items-center mb-3">
                              <label className="text-sm font-bold text-amber-800">知識點 {idx + 1}</label>
                              {formData.points[idx].point_name && (
                                  <button onClick={() => handlePointInput(idx, 'point_name', '')} className="text-xs text-gray-400 hover:text-red-500">清除</button>
                              )}
                           </div>
                           
                           <select 
                              className="w-full p-2 mb-3 text-sm border border-amber-200 rounded-lg bg-white focus:outline-none focus:border-amber-400 truncate"
                              value={formData.points[idx].point_id}
                              onChange={(e) => handlePointSelect(idx, e.target.value)}
                           >
                              <option value="">-- 從資料庫快速帶入 --</option>
                              {availablePointsForSelect.map(p => (
                                 <option key={p.id} value={p.point_id}>{p.point_id} - {p.point_name}</option>
                              ))}
                           </select>

                           <div className="space-y-3">
                               <div>
                                  <input 
                                     className="w-full p-2 text-base border border-gray-300 rounded-lg bg-white focus:outline-none focus:border-amber-400 font-bold" 
                                     value={formData.points[idx].point_name} 
                                     onChange={e => handlePointInput(idx, 'point_name', e.target.value)} 
                                     placeholder="輸入名稱/觀念" 
                                  />
                               </div>
                               <div className="flex items-center gap-2">
                                  <Icons.BookOpen />
                                  <input 
                                     type="number" 
                                     className="w-full p-2 text-base border border-amber-300 rounded-lg bg-white focus:outline-none focus:border-amber-500 text-amber-700 font-bold" 
                                     value={formData.points[idx].page} 
                                     onChange={e => handlePointInput(idx, 'page', e.target.value)} 
                                     placeholder="講義頁碼" 
                                  />
                               </div>
                           </div>
                        </div>
                     ))}
                 </div>
              </div>
            </div>

            <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 space-y-5">
              <div>
                <div className="flex justify-between items-center mb-2">
                  <label className="block text-base font-bold text-gray-700">🤖 AI 老師教學</label>
                  <button onClick={() => setShowTutorPreview(!showTutorPreview)} className="text-sm font-bold text-amber-600 hover:bg-amber-50 px-3 py-1 rounded-lg transition-colors border border-amber-200">
                    {showTutorPreview ? '✏️ 切換為編輯模式' : '✨ 預覽數學/化學式'}
                  </button>
                </div>
                {showTutorPreview ? (
                  <div className="w-full p-4 text-lg border border-gray-300 rounded-xl bg-amber-50/30 min-h-[12rem] overflow-y-auto">
                    <LatexText content={formData.ai_tutor} className="whitespace-pre-wrap leading-relaxed text-gray-800" />
                  </div>
                ) : (
                  <textarea className="w-full p-4 text-lg border border-gray-300 rounded-xl bg-amber-50/50 focus:ring-2 focus:ring-[#f59e0b] outline-none h-48 leading-relaxed" placeholder="AI 將自動產生詳細解析與步驟..." value={formData.ai_tutor} onChange={e => setFormData({...formData, ai_tutor: e.target.value})} />
                )}
              </div>
              <div>
                <label className="block text-base font-bold text-gray-700 mb-2">📝 錯題筆記 / 訂正過程 (手寫板)</label>
                <NoteCanvas initialDataUrl={formData.notes} onChange={(dataUrl) => setFormData({...formData, notes: dataUrl})} />
              </div>
            </div>
          </div>
        </div>
      );
    }

    function ListView({ currentProfile, knowledgePoints, onBack, FB, user, isDbConnected, onFullEdit }) {
      const { showConfirm } = useModal();
      const [activeTab, setActiveTab] = useState('list'); 
      const [mistakes, setMistakes] = useState([]);
      const [filterSubject, setFilterSubject] = useState('All');
      const [filterChapter, setFilterChapter] = useState('All');
      const [filterMastery, setFilterMastery] = useState('All'); 
      const [searchQuery, setSearchQuery] = useState(''); 
      const [isFetching, setIsFetching] = useState(true);
      
      const [filterStartDate, setFilterStartDate] = useState('');
      const [filterEndDate, setFilterEndDate] = useState('');
      const [expandedSections, setExpandedSections] = useState({});
      const [lightboxImage, setLightboxImage] = useState(null);
      
      useEffect(() => {
        if (!user || !FB || !currentProfile) return;
        setIsFetching(true);
        const colRef = FB.collection(FB.db, 'artifacts', FB.appId, 'public', 'data', `mistakes_${currentProfile}`);
        const unsubscribe = FB.onSnapshot(colRef, (snapshot) => {
            const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            data.sort((a, b) => {
                const timeA = a.created_date ? new Date(a.created_date).getTime() : Number(a.timestamp || a.updated_at || 0);
                const timeB = b.created_date ? new Date(b.created_date).getTime() : Number(b.timestamp || b.updated_at || 0);
                return timeB - timeA; 
            });
            setMistakes(data);
            setIsFetching(false);
        }, (error) => {
            console.error("雲端讀取錯誤:", error);
            alert("雲端讀取發生異常，請確認網路連線。\n" + error.message);
            setIsFetching(false);
        });
        return () => unsubscribe();
      }, [user, FB, currentProfile]);

      const handleDelete = async (id) => {
        if (!user || !FB || !currentProfile) return;
        showConfirm('確定要從雲端刪除這題嗎？(刪除後無法復原)', async () => {
          try { await FB.deleteDoc(FB.doc(FB.db, 'artifacts', FB.appId, 'public', 'data', `mistakes_${currentProfile}`, id)); } 
          catch(e) { alert('刪除失敗'); }
        });
      };

      const handleUpdateMastery = async (id, currentMastery) => {
        if (!user || !FB || !currentProfile) return;
        const newMastery = (!currentMastery || currentMastery === 'need_review') ? 'mastered' : 'need_review';
        try {
          await FB.updateDoc(FB.doc(FB.db, 'artifacts', FB.appId, 'public', 'data', `mistakes_${currentProfile}`, id), { mastery: newMastery });
        } catch (e) { alert('狀態更新失敗'); }
      };

      const toggleSection = (id, type) => setExpandedSections(prev => ({...prev, [`${id}_${type}`]: !prev[`${id}_${type}`]}));
      const handleSubjectChange = (sub) => { setFilterSubject(sub); setFilterChapter('All'); };

      let filteredData = mistakes;
      if (filterSubject !== 'All') filteredData = filteredData.filter(m => m.subject === filterSubject);
      if (filterChapter !== 'All') filteredData = filteredData.filter(m => (m.chapter || m.sub_subject) === filterChapter);
      if (filterMastery !== 'All') filteredData = filteredData.filter(m => (m.mastery || 'need_review') === filterMastery);
      
      if (filterStartDate) filteredData = filteredData.filter(m => (m.created_date || getDateStr(m.timestamp)) >= filterStartDate);
      if (filterEndDate) filteredData = filteredData.filter(m => (m.created_date || getDateStr(m.timestamp)) <= filterEndDate);

      if (searchQuery.trim()) {
         const q = searchQuery.toLowerCase().trim();
         filteredData = filteredData.filter(m => {
            const matchPoints = m.points ? m.points.some(p => p.point_name && p.point_name.toLowerCase().includes(q)) : false;
            return matchPoints ||
            (m.concept && m.concept.toLowerCase().includes(q)) || 
            (m.point_name && m.point_name.toLowerCase().includes(q)) || 
            (m.ai_tutor && m.ai_tutor.toLowerCase().includes(q)) ||
            (m.chapter && m.chapter.toLowerCase().includes(q)) ||
            (m.sub_subject && m.sub_subject.toLowerCase().includes(q));
         });
      }

      const subjects = ['All', ...Array.from(new Set(mistakes.map(m => m.subject)))];
      let availableChapters = [];
      if (filterSubject !== 'All') {
         availableChapters = ['All', ...Array.from(new Set(mistakes.filter(m => m.subject === filterSubject).map(m => m.chapter || m.sub_subject).filter(Boolean)))];
      }

      const getDisplayChapterName = (item) => {
         if (item.chapter) return item.chapter.split('(')[0].trim();
         if (item.sub_subject) return item.sub_subject.split('(')[0].trim();
         return '';
      };

      const statsData = Array.from(new Set(mistakes.map(m => m.subject))).map(sub => {
         const subMistakes = mistakes.filter(m => m.subject === sub);
         if (subMistakes.length === 0) return null;
         const chapterMap = {};
         subMistakes.forEach(m => {
            const displayChap = getDisplayChapterName(m);
            const key = displayChap || '未分類';
            chapterMap[key] = (chapterMap[key] || 0) + 1;
         });
         return { subject: sub, total: subMistakes.length, chapters: Object.entries(chapterMap).sort((a, b) => b[1] - a[1]) };
      }).filter(Boolean);

      const handlePrint = () => { setTimeout(() => { window.print(); }, 100); };

      if (isFetching) return <LoadingView message={`正在從雲端載入 ${currentProfile} 的錯題本...`} />;

      return (
        <div className="min-h-screen bg-gray-50 relative">
          <div className="bg-[#f59e0b] text-[#ffffff] p-5 sticky top-0 z-10 shadow-md flex justify-between items-center no-print">
            <button onClick={onBack} className="p-2 hover:bg-[#d97706] rounded-full transition-colors"><Icons.ArrowLeft /></button>
            <div className="flex items-center gap-2">
               <h1 className="font-bold text-xl sm:text-2xl truncate max-w-[200px] sm:max-w-xs">📚 {currentProfile} 的雲端錯題本</h1>
               <div title="雲端連線狀態" className="ml-1"><Icons.StatusDot color={isDbConnected ? "#4ade80" : "#ef4444"} /></div>
            </div>
            <button onClick={handlePrint} className="bg-white text-[#451a03] px-4 py-2.5 rounded-lg font-bold flex items-center gap-2 hover:bg-amber-50 transition-colors shadow-sm text-base">
              <Icons.Printer /> <span className="hidden sm:inline">🖨️ 輸出 PDF</span>
            </button>
          </div>

          <div className="p-4 md:p-5 bg-white border-b no-print space-y-5">
            <div className="w-[98%] max-w-[1400px] mx-auto flex justify-center mb-2">
                <div className="bg-gray-100 p-1.5 rounded-2xl flex gap-2 w-full max-w-md shadow-inner">
                   <button onClick={() => setActiveTab('stats')} className={`flex-1 py-3 rounded-xl font-bold text-lg transition-all flex justify-center items-center gap-2 ${activeTab === 'stats' ? 'bg-white text-[#b45309] shadow-md transform scale-105' : 'text-gray-500 hover:text-gray-700'}`}>📊 弱點分析</button>
                   <button onClick={() => setActiveTab('list')} className={`flex-1 py-3 rounded-xl font-bold text-lg transition-all flex justify-center items-center gap-2 ${activeTab === 'list' ? 'bg-white text-[#b45309] shadow-md transform scale-105' : 'text-gray-500 hover:text-gray-700'}`}>📝 錯題列表</button>
                </div>
            </div>

            {activeTab === 'list' && (
              <>
                <div className="w-[98%] max-w-[1400px] mx-auto relative mt-4">
                   <div className="absolute left-4 top-3.5 text-gray-400"><Icons.Search /></div>
                   <input type="text" placeholder="搜尋知識點名稱、章節..." className="w-full pl-12 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-[#f59e0b] outline-none transition-shadow text-lg font-bold" value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} />
                </div>

                <div className="flex flex-col xl:flex-row gap-4 w-[98%] max-w-[1400px] mx-auto justify-between items-start xl:items-center mt-4">
                    <div className="flex gap-3 overflow-x-auto whitespace-nowrap w-full xl:w-auto scrollbar-hide pb-2">
                      {subjects.map(sub => (
                        <button key={sub} onClick={() => handleSubjectChange(sub)} className={`px-5 py-2.5 rounded-full text-base font-bold transition-colors flex-shrink-0 border ${filterSubject === sub ? 'bg-[#f59e0b] text-[#ffffff] border-[#f59e0b]' : 'bg-white text-gray-600 hover:bg-gray-100 border-gray-200 shadow-sm'}`}>
                          {sub === 'All' ? '綜合' : sub}
                        </button>
                      ))}
                    </div>
                    
                    <div className="flex flex-wrap sm:flex-nowrap gap-3 w-full xl:w-auto">
                        <div className="flex gap-2 bg-gray-50 p-2 rounded-xl border border-gray-100 w-full sm:w-auto overflow-x-auto">
                            <button onClick={() => setFilterMastery('All')} className={`px-4 py-2 text-sm font-bold rounded-lg whitespace-nowrap ${filterMastery === 'All' ? 'bg-white shadow-md text-gray-800' : 'text-gray-500 hover:text-gray-700'}`}>全部熟練度</button>
                            <button onClick={() => setFilterMastery('need_review')} className={`px-4 py-2 text-sm font-bold rounded-lg whitespace-nowrap flex items-center gap-1.5 ${filterMastery === 'need_review' ? 'bg-white shadow-md text-red-600' : 'text-gray-500 hover:text-red-500'}`}>🔴 需複習</button>
                            <button onClick={() => setFilterMastery('mastered')} className={`px-4 py-2 text-sm font-bold rounded-lg whitespace-nowrap flex items-center gap-1.5 ${filterMastery === 'mastered' ? 'bg-white shadow-md text-green-600' : 'text-gray-500 hover:text-green-600'}`}>🟢 已掌握</button>
                        </div>
                        <div className="flex items-center gap-2 bg-gray-50 p-2 rounded-xl border border-gray-100 flex-grow sm:flex-grow-0 min-w-max shadow-sm">
                            <span className="text-amber-600 pl-1"><Icons.Calendar /></span>
                            <input type="date" className="bg-transparent text-sm font-bold text-gray-700 outline-none cursor-pointer" value={filterStartDate} onChange={e => setFilterStartDate(e.target.value)} title="開始日期" />
                            <span className="text-gray-400 font-bold px-1">-</span>
                            <input type="date" className="bg-transparent text-sm font-bold text-gray-700 outline-none cursor-pointer" value={filterEndDate} onChange={e => setFilterEndDate(e.target.value)} title="結束日期" />
                            {(filterStartDate || filterEndDate) && (
                                <button onClick={() => { setFilterStartDate(''); setFilterEndDate(''); }} className="text-gray-400 hover:text-red-500 bg-gray-200 hover:bg-red-100 rounded-full p-1 ml-1 transition-colors"><Icons.Close /></button>
                            )}
                        </div>
                    </div>
                </div>
                
                {filterSubject !== 'All' && availableChapters.length > 1 && (
                  <div className="flex gap-3 w-[98%] max-w-[1400px] mx-auto pt-2 overflow-x-auto scrollbar-hide pb-2 border-t border-gray-100 border-dashed mt-2">
                    {availableChapters.map(chap => (
                      <button key={chap} onClick={() => setFilterChapter(chap)}
                        className={`px-4 py-2 rounded-full text-sm font-bold transition-colors flex-shrink-0 ${filterChapter === chap ? 'bg-amber-600 text-white shadow-md' : 'bg-gray-50 text-gray-600 hover:bg-gray-200 border border-gray-200'}`}>
                        {chap === 'All' ? '全部章節' : getDisplayChapterName({chapter: chap})}
                      </button>
                    ))}
                  </div>
                )}
              </>
            )}
          </div>

          <div id="print-area" className="w-full">
             {activeTab === 'stats' && (
                <div className="p-4 md:p-6 w-[98%] max-w-[1400px] mx-auto space-y-8 bg-gray-50 print:bg-white">
                   {statsData.length === 0 ? (
                      <div className="text-center py-24 text-gray-400 no-print">
                         <p className="mt-5 text-2xl font-bold">🔍 目前沒有錯題資料可供分析</p>
                      </div>
                   ) : (
                      <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 sm:gap-8">
                         {statsData.map(stat => {
                           const maxChapterCount = Math.max(...stat.chapters.map(c => c[1]));
                           return (
                             <div key={stat.subject} className="bg-white rounded-3xl p-6 sm:p-8 shadow-sm border border-gray-200 break-inside-avoid print:shadow-none print:border-black print:mb-6">
                                <div className="flex justify-between items-center mb-6 border-b border-amber-100 pb-4 print:border-gray-400">
                                   <h3 className="text-2xl sm:text-3xl font-black text-[#b45309] print:text-black flex items-center gap-2"><Icons.Book /> {stat.subject}</h3>
                                   <span className="bg-[#fffbeb] border border-amber-200 print:border-black text-[#b45309] print:text-black px-4 py-1.5 rounded-xl font-bold text-lg">共 {stat.total} 題</span>
                                </div>
                                <div className="space-y-6">
                                   {stat.chapters.map(([chapName, count]) => {
                                      const pct = (count / maxChapterCount) * 100;
                                      const isWeakness = count === maxChapterCount && count > 1;
                                      const barColor = isWeakness ? 'bg-red-500 print:bg-black' : 'bg-[#f59e0b] print:bg-gray-500';
                                      const textColor = isWeakness ? 'text-red-600 print:text-black' : 'text-gray-700 print:text-black';
                                      
                                      return (
                                         <div key={chapName} className="flex flex-col gap-2">
                                            <div className="flex justify-between items-end gap-4">
                                               <span className={`font-bold text-sm sm:text-base break-words flex-1 ${textColor}`}>
                                                  {chapName}
                                                  {isWeakness && <span className="ml-2 text-xs bg-red-100 text-red-600 px-2 py-0.5 rounded-full print:border print:border-black print:bg-white print:text-black inline-block transform -translate-y-px">🚨 需補強</span>}
                                               </span>
                                               <span className={`font-black text-base sm:text-lg whitespace-nowrap ${textColor}`}>{count} 題</span>
                                            </div>
                                            <div className="w-full bg-gray-100 rounded-full h-3 overflow-hidden shadow-inner print:bg-transparent print:border print:border-gray-300 print:shadow-none">
                                               <div className={`${barColor} h-full rounded-full transition-all`} style={{ width: `${pct}%` }}></div>
                                            </div>
                                         </div>
                                      );
                                   })}
                                </div>
                             </div>
                           );
                         })}
                      </div>
                   )}
                </div>
             )}

             {activeTab === 'list' && (
                <div className="p-4 md:p-5 print:p-0 w-[98%] max-w-[1400px] mx-auto space-y-8 print:space-y-0 bg-[#fffbeb] print:bg-white">
                  {filteredData.length === 0 ? (
                     <div className="text-center py-24 text-gray-400 no-print">
                        <p className="mt-5 text-2xl font-bold">🔍 找不到符合條件的錯題</p>
                     </div>
                  ) : (
                    filteredData.map((item, index) => (
                      <div key={item.id} className={`bg-white p-7 print-card rounded-2xl shadow-sm border border-gray-200 print:shadow-none print:border-black break-inside-avoid print:bg-white ${item.mastery === 'mastered' ? 'print:hidden' : ''}`}>
                        <div className="flex flex-col sm:flex-row justify-between items-start gap-4 mb-5 print:mb-1">
                          
                          <div className="flex items-start gap-3 sm:gap-4 w-full">
                              <div className="text-4xl print:text-xl font-black text-[#f59e0b] print:text-black leading-none pt-1 print:pt-0">
                                {String(index + 1).padStart(2, '0')}
                              </div>
                              
                              <div className="flex flex-col w-full gap-2">
                                  {/* 第1行：科目、章節、日期、狀態鈕 */}
                                  <div className="flex flex-wrap gap-2 print:gap-1.5 items-center w-full">
                                      <span className="bg-amber-50 print:bg-transparent print:border print:border-black text-[#b45309] print:text-black px-4 py-1.5 print:px-2 print:py-0.5 rounded-full text-base print:text-sm font-bold border border-amber-200">
                                        {item.subject}
                                      </span>
                                      
                                      {getDisplayChapterName(item) && (
                                        <span className="bg-gray-100 print:bg-transparent print:border print:border-black text-gray-700 print:text-black px-4 py-1.5 print:px-2 print:py-0.5 rounded-full text-base print:text-sm font-semibold">
                                            {getDisplayChapterName(item)}
                                        </span>
                                      )}
                                      
                                      <span className="text-sm font-bold text-gray-500 bg-gray-50 px-3 py-1.5 rounded-full flex items-center gap-1.5 border border-gray-200">
                                          <Icons.Calendar /> {item.created_date || getDateStr(item.timestamp)}
                                      </span>

                                      <button onClick={() => handleUpdateMastery(item.id, item.mastery)} className={`no-print sm:ml-auto px-4 py-1.5 rounded-full text-base font-bold transition-colors border shadow-sm flex items-center gap-2 ${(!item.mastery || item.mastery === 'need_review') ? 'bg-red-50 text-red-600 border-red-200 hover:bg-red-100' : 'bg-green-50 text-green-600 border-green-200 hover:bg-green-100'}`}>
                                        {(!item.mastery || item.mastery === 'need_review') ? '🔴 需複習' : '🟢 已掌握'}
                                      </button>
                                  </div>
                                  
                                  {/* 第2行：核心知識點與講義頁碼 (支援多筆) */}
                                  <div className="flex flex-wrap gap-2 mt-1">
                                      {item.points && item.points.map((p, idx) => {
                                          if (!p.point_name) return null;
                                          return (
                                              <div key={idx} className="flex flex-wrap gap-2 items-center bg-gray-50/50 p-1 rounded-xl">
                                                 <span className="bg-gray-100 print:bg-transparent print:border print:border-black text-gray-800 print:text-black px-4 py-1.5 print:px-2 print:py-0.5 rounded-full text-base print:text-sm font-bold border border-gray-200">
                                                   🎯 {p.point_id ? p.point_id + ' ' : ''}{p.point_name}
                                                 </span>
                                                 {p.page && (
                                                     <span className="bg-indigo-100 border border-indigo-200 print:bg-transparent print:border print:border-black text-indigo-700 print:text-black px-4 py-1.5 print:px-2 print:py-0.5 rounded-full text-base print:text-sm font-black shadow-sm flex items-center gap-1">
                                                         <Icons.BookOpen /> 大滿貫 p.{p.page}
                                                     </span>
                                                 )}
                                              </div>
                                          )
                                      })}

                                      {/* 向下相容舊版單筆資料 */}
                                      {!item.points && item.concept && (
                                          <div className="flex flex-wrap gap-2 items-center bg-gray-50/50 p-1 rounded-xl">
                                              <span className="bg-gray-100 print:bg-transparent print:border print:border-black text-gray-800 print:text-black px-4 py-1.5 print:px-2 print:py-0.5 rounded-full text-base print:text-sm font-bold border border-gray-200">
                                                🎯 {item.point_id ? item.point_id + ' ' : ''}{item.point_name || item.concept}
                                              </span>
                                              {item.page && (
                                                  <span className="bg-indigo-100 border border-indigo-200 print:bg-transparent print:border print:border-black text-indigo-700 print:text-black px-4 py-1.5 print:px-2 print:py-0.5 rounded-full text-base print:text-sm font-black shadow-sm flex items-center gap-1">
                                                      <Icons.BookOpen /> 大滿貫 p.{item.page}
                                                  </span>
                                              )}
                                          </div>
                                      )}
                                  </div>
                              </div>
                          </div>

                          <div className="flex items-center gap-2 self-end sm:self-auto no-print flex-shrink-0 mt-3 sm:mt-0">
                              <button onClick={() => onFullEdit(item)} className="text-gray-500 hover:text-[#f59e0b] bg-gray-100 hover:bg-amber-50 px-3 py-2 rounded-lg font-bold text-sm transition-colors flex items-center gap-1 shadow-sm"><Icons.Edit /> 完整編輯</button>
                              <button onClick={() => handleDelete(item.id)} className="text-gray-400 hover:text-red-500 hover:bg-red-50 p-2 rounded-lg transition-colors"><Icons.Trash /></button>
                          </div>
                        </div>
                        
                        <div className="mb-5 bg-white relative group cursor-pointer" onClick={() => setLightboxImage(item.image)}>
                           <img src={item.image} alt="Question" className="max-w-full h-auto border border-gray-200 rounded-xl print:border-none print-img mx-auto print:ml-0 print:mr-auto block bg-white transition-opacity group-hover:opacity-90" style={item.printWidth ? { width: `${item.printWidth}px` } : {}} />
                           <div className="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity no-print pointer-events-none">
                              <div className="bg-black/60 text-white rounded-full p-4 backdrop-blur-sm"><Icons.ZoomIn /></div>
                           </div>
                        </div>

                        {(item.ai_tutor || item.answer || item.notes) && (
                          <div className="bg-amber-50 p-5 rounded-2xl border border-amber-200 print:hidden space-y-5">
                            {(item.ai_tutor || item.answer) && (
                              <div>
                                <div className="font-bold text-gray-800 text-xl mb-2 flex items-center justify-between cursor-pointer" onClick={() => toggleSection(item.id, 'ai')}>
                                   <div className="flex items-center gap-2">🤖 AI老師教學 / 解答</div>
                                   <button className="text-gray-500 hover:text-amber-600 transition-colors no-print font-bold flex items-center gap-1">
                                       {expandedSections[`${item.id}_ai`] ? '🐾 收起' : '✨ 顯示'}
                                   </button>
                                </div>
                                {expandedSections[`${item.id}_ai`] && (
                                    <div className="text-gray-800 text-lg bg-white/60 p-4 rounded-xl shadow-sm border border-amber-100/50">
                                       <LatexText content={item.ai_tutor || item.answer} className="whitespace-pre-wrap leading-relaxed" />
                                    </div>
                                )}
                              </div>
                            )}
                            {item.notes && (
                              <div>
                                <div className="font-bold text-[#b45309] text-xl mb-2 flex items-center justify-between cursor-pointer" onClick={() => toggleSection(item.id, 'note')}>
                                   <div className="flex items-center gap-2">📝 錯題筆記 / 訂正過程</div>
                                   <button className="text-gray-500 hover:text-amber-600 transition-colors no-print font-bold flex items-center gap-1">
                                       {expandedSections[`${item.id}_note`] ? '🐾 收起' : '✨ 顯示'}
                                   </button>
                                </div>
                                {expandedSections[`${item.id}_note`] && (
                                    <img src={item.notes} alt="Handwritten Notes" className="w-full h-auto object-contain bg-white border border-amber-200 rounded-xl shadow-sm" style={{ maxHeight: '600px' }} />
                                )}
                              </div>
                            )}
                          </div>
                        )}
                      </div>
                    ))
                  )}
                </div>
             )}
          </div>
          
          {lightboxImage && (
              <div className="fixed inset-0 z-[9999] bg-black/90 flex flex-col p-4 animate-[fadeIn_0.2s_ease-out]" onClick={() => setLightboxImage(null)}>
                  <div className="flex justify-end p-2 text-white"><button className="hover:text-amber-500 transition-colors p-2" onClick={() => setLightboxImage(null)}><Icons.Close /></button></div>
                  <div className="flex-grow flex items-center justify-center overflow-auto p-4 cursor-zoom-out">
                      <img src={lightboxImage} alt="Fullscreen View" className="max-w-full max-h-full object-contain bg-white rounded-lg" onClick={(e) => e.stopPropagation()} />
                  </div>
              </div>
          )}
        </div>
      );
    }

    function App() {
       return <ModalProvider><MainApp /></ModalProvider>;
    }
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
