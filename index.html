              {formData.tags.length > 0 && (
                  <div className="flex flex-wrap gap-2 pt-1">
                     {formData.tags.map(tag => (
                         <span key={tag} className="bg-amber-100 text-amber-800 px-3 py-1.5 rounded-lg flex items-center gap-2 font-bold text-sm border border-amber-200">
                             #{tag}
                             <button onClick={() => removeTag(tag)} className="text-amber-600 hover:text-red-500 bg-amber-200 rounded-full p-0.5"><Icons.Close /></button>
                         </span>
                     ))}
                  </div>
              )}

              <div>
                <label className="block text-base font-bold text-gray-700 mb-2">科目</label>
                <select className="w-full p-4 text-lg border border-gray-300 rounded-xl bg-gray-50 focus:ring-2 focus:ring-[#f59e0b] outline-none" value={formData.subject} onChange={handleSubjectChange}>
                  <option value="">待確認科目</option>
                  {SUBJECT_ORDER.map(s => <option key={s} value={s}>{s}</option>)}
                </select>
              </div>
              
              {CURRICULUM_DB[formData.subject]?.hasVolume && (
              <div>
                <label className="block text-base font-bold text-gray-700 mb-2">冊別</label>
                <select className="w-full p-4 text-lg border border-gray-300 rounded-xl bg-gray-50 focus:ring-2 focus:ring-[#f59e0b] outline-none" value={formData.volume} onChange={handleVolumeChange}>
                  {Object.keys(CURRICULUM_DB[formData.subject].volumes).map(v => <option key={v} value={v}>{v}</option>)}
                </select>
              </div>
              )}

              <div>
                <label className="block text-base font-bold text-gray-700 mb-2">次標題 / 大單元</label>
                <select className="w-full p-4 text-lg border border-gray-300 rounded-xl bg-gray-50 focus:ring-2 focus:ring-[#f59e0b] outline-none" value={formData.sub_subject} onChange={e => setFormData({...formData, sub_subject: e.target.value, section: ''})}>
                  <option value="">待確認章節</option>
                  {CURRICULUM_DB[formData.subject]?.hasVolume 
                    ? CURRICULUM_DB[formData.subject].volumes[formData.volume].map(c => <option key={c} value={c}>{c}</option>)
                    : (CURRICULUM_DB[formData.subject]?.chapters || []).map(c => <option key={c} value={c}>{c}</option>)
                  }
                </select>
              </div>
              <div>
                <label className="block text-base font-bold text-gray-700 mb-2">小節</label>
                <select aria-label="小節" className="w-full p-4 text-lg border rounded-xl bg-gray-50" value={formData.section}
                  disabled={!getSections(formData.subject, formData.volume, formData.sub_subject).length}
                  onChange={e => setFormData({...formData, section: e.target.value})}>
                  <option value="">{getSections(formData.subject, formData.volume, formData.sub_subject).length ? '未分類／待確認小節' : '此單元未提供小節'}</option>
                  {getSections(formData.subject, formData.volume, formData.sub_subject).map(section => <option key={section}>{section}</option>)}
                </select>
              </div>
              <div>
                <label className="block text-base font-bold text-gray-700 mb-2">核心知識 (限繁體中文)</label>
                <input className="w-full p-4 text-lg border border-gray-300 rounded-xl bg-gray-50 focus:ring-2 focus:ring-[#f59e0b] outline-none" value={formData.concept} onChange={e => setFormData({...formData, concept: e.target.value})} />
              </div>
            </div>

            <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 space-y-5">
              <div>
                {formData.needs_review && <div role="status" className="p-4 mb-4 rounded-xl bg-yellow-100 text-amber-900">⚠️ 待確認：{formData.review_reason || '請核對題目、分類與答案。'}<label className="block mt-2"><input type="checkbox" onChange={() => setFormData({...formData, needs_review: false, review_reason: ''})} /> 我已人工核對分類與解析</label></div>}
                {formData.question_text && <details className="mb-4"><summary>查看 AI 辨識的題目與分類依據</summary><p className="whitespace-pre-wrap">{formData.question_text}</p><p>{formData.classification_reason}</p></details>}
                <div className="flex justify-between items-center mb-2">
                  <label className="block text-base font-bold text-gray-700">🤖 AI 老師教學</label>
                  <button onClick={() => setShowTutorPreview(!showTutorPreview)} className="text-sm font-bold text-amber-600 hover:bg-amber-50 px-3 py-1 rounded-lg transition-colors border border-amber-200">
                    {showTutorPreview ? '✏️ 切換為編輯模式' : '✨ 預覽數學/化學式'}
                  </button>
                </div>
                {showTutorPreview ? (
                  <div className="w-full p-4 text-lg border border-gray-300 rounded-xl bg-amber-50/30 min-h-[12rem] overflow-y-auto">
                    <LatexText content={formData.ai_tutor} className="whitespace-pre-wrap leading-relaxed text-gray-800" />
                  </div>
                ) : (
                  <textarea className="w-full p-4 text-lg border border-gray-300 rounded-xl bg-amber-50/50 focus:ring-2 focus:ring-[#f59e0b] outline-none h-48 leading-relaxed" placeholder="AI 將自動產生詳細解析與步驟..." value={formData.ai_tutor} onChange={e => setFormData({...formData, ai_tutor: e.target.value})} />
                )}
              </div>
              <div>
                <label className="block text-base font-bold text-gray-700 mb-2">📝 錯題筆記 / 訂正過程 (手寫板)</label>
                <NoteCanvas initialDataUrl={formData.notes} onChange={(dataUrl) => setFormData({...formData, notes: dataUrl})} />
              </div>
            </div>
          </div>
        </div>
      );
    }

    // --- STREAMING_CHUNK:Building ListView with Tag filtering & Lightbox... ---
    function ListView({ currentProfile, onBack, FB, user, isDbConnected, onFullEdit }) {
      const { showConfirm } = useModal();
      const [activeTab, setActiveTab] = useState('stats'); 
      const [mistakes, setMistakes] = useState([]);
      const [filterSubject, setFilterSubject] = useState('All');
      const [filterVolume, setFilterVolume] = useState('All');
      const [filterSubSubject, setFilterSubSubject] = useState('All');
      const [filterSection, setFilterSection] = useState('All');
      const [filterMastery, setFilterMastery] = useState('All'); 
      const [searchQuery, setSearchQuery] = useState(''); 
      const [isFetching, setIsFetching] = useState(true);
      const [readStatus, setReadStatus] = useState('loading');
      const [readError, setReadError] = useState('');
      const [reloadCount, setReloadCount] = useState(0);
      
      // ★ 日期過濾狀態
      const [filterStartDate, setFilterStartDate] = useState('');
      const [filterEndDate, setFilterEndDate] = useState('');

      const [expandedSections, setExpandedSections] = useState({});

      const [lightboxImage, setLightboxImage] = useState(null);
      
      useEffect(() => {
        setMistakes([]);
        setReadError('');
        if (!user || !FB || !currentProfile) {
          setReadStatus('waiting');
          setIsFetching(false);
          return;
        }
        setIsFetching(true);
        setReadStatus('loading');
        let active = true;
        let receivedServer = false;
        const timeout = setTimeout(() => {
          if (!active || receivedServer) return;
          setIsFetching(false);
          setReadStatus('timeout');
          setReadError('尚未取得伺服器確認。請檢查網路連線，或按「重新讀取」；目前不能判定雲端是否有題目。');
        }, 15000);
        const colRef = FB.collection(FB.db, 'artifacts', FB.appId, 'public', 'data', `mistakes_${currentProfile}`);
        const unsubscribe = FB.onSnapshot(colRef, { includeMetadataChanges: true }, (snapshot) => {
            if (!active) return;
            const fromCache = snapshot.metadata.fromCache;
            receivedServer = !fromCache;
            if (!fromCache) clearTimeout(timeout);
            setReadStatus(fromCache ? 'cache' : 'server');
            setReadError('');
            const data = snapshot.docs.map(doc => normalizeCurriculumItem({ id: doc.id, ...doc.data() }));
            
            // 依實際建立時間由新到舊排序；舊資料缺少時間戳記時才使用建檔日期。
            const getCreatedTime = (item) => {
                const timestamp = Number(item.timestamp);
                if (Number.isFinite(timestamp) && timestamp > 0) return timestamp;
                const date = item.created_date ? new Date(item.created_date).getTime() : 0;
                return Number.isFinite(date) ? date : 0;
            };
            data.sort((a, b) => {
                return getCreatedTime(b) - getCreatedTime(a);
            });
            
            setMistakes(data);
            setIsFetching(false);
        }, (error) => {
            if (!active) return;
            clearTimeout(timeout);
            console.error("雲端讀取錯誤:", error);
            setReadStatus('error');
            setReadError(`雲端讀取失敗（${error.code || 'unknown'}）：${error.message || '請確認網路與讀取權限。'}`);
            setIsFetching(false);
        });
        
        return () => { active = false; clearTimeout(timeout); unsubscribe(); };
      }, [user, FB, currentProfile, reloadCount]);

      const handleDelete = async (id) => {
        if (!user || !FB || !currentProfile) return;
        showConfirm('確定要從雲端刪除這題嗎？(刪除後無法復原)', async () => {
          try { await FB.deleteDoc(FB.doc(FB.db, 'artifacts', FB.appId, 'public', 'data', `mistakes_${currentProfile}`, id)); } 
          catch(e) { alert('刪除失敗'); }
        });
      };

      const handleUpdateMastery = async (id, currentMastery) => {
        if (!user || !FB || !currentProfile) return;
        const newMastery = (!currentMastery || currentMastery === 'need_review') ? 'mastered' : 'need_review';
        try {
          await FB.updateDoc(FB.doc(FB.db, 'artifacts', FB.appId, 'public', 'data', `mistakes_${currentProfile}`, id), {
            mastery: newMastery
          });
        } catch (e) {
          console.error(e);
          alert('狀態更新失敗');
        }
      };

      const toggleSection = (id, type) => {
          setExpandedSections(prev => ({...prev, [`${id}_${type}`]: !prev[`${id}_${type}`]}));
      };

      const handleSubjectChange = (sub) => { setFilterSubject(sub); setFilterVolume('All'); setFilterSubSubject('All'); setFilterSection('All'); };
      const handleVolumeChange = (vol) => { setFilterVolume(vol); setFilterSubSubject('All'); setFilterSection('All'); };

      let filteredData = mistakes;
      if (filterSubject !== 'All') filteredData = filteredData.filter(m => m.subject === filterSubject);
      if (filterVolume !== 'All') filteredData = filteredData.filter(m => m.volume === filterVolume);
      if (filterSubSubject !== 'All') filteredData = filteredData.filter(m => m.sub_subject === filterSubSubject);
      if (filterSection !== 'All') filteredData = filteredData.filter(m => (m.section || '') === filterSection);
      if (filterMastery !== 'All') filteredData = filteredData.filter(m => (m.mastery || 'need_review') === filterMastery);
      
      // ★ 執行日期過濾
      if (filterStartDate) {
          filteredData = filteredData.filter(m => {
              const mDate = m.created_date || getDateStr(m.timestamp);
              return mDate >= filterStartDate;
          });
      }
      if (filterEndDate) {
          filteredData = filteredData.filter(m => {
              const mDate = m.created_date || getDateStr(m.timestamp);
              return mDate <= filterEndDate;
          });
      }

      if (searchQuery.trim()) {
         const q = searchQuery.toLowerCase().trim();
         filteredData = filteredData.filter(m => {
            const hasTag = m.tags && m.tags.some(tag => tag.toLowerCase().includes(q));
            return hasTag ||
            (m.section && m.section.toLowerCase().includes(q)) ||
            (m.concept && m.concept.toLowerCase().includes(q)) || 
            (m.ai_tutor && m.ai_tutor.toLowerCase().includes(q)) ||
            (m.sub_subject && m.sub_subject.toLowerCase().includes(q)) ||
            (m.subject && m.subject.toLowerCase().includes(q)) ||
            (m.volume && m.volume.toLowerCase().includes(q));
         });
      }

      const subjects = ['All', ...SUBJECT_ORDER];
      let availableVolumes = [];
      let availableSubSubjects = [];
      
      if (filterSubject !== 'All') {
         const info = CURRICULUM_DB[filterSubject];
         if (info && info.hasVolume) {
             availableVolumes = ['All', ...Object.keys(info.volumes)];
             if (filterVolume === 'All') {
                 Object.values(info.volumes).forEach(arr => availableSubSubjects.push(...arr));
             } else {
                 availableSubSubjects = info.volumes[filterVolume] || [];
             }
             availableSubSubjects = ['All', ...availableSubSubjects];
         } else if (info) {
             availableSubSubjects = ['All', ...info.chapters];
         }
      }

      const availableSections = [...new Set(CURRICULUM_PATHS.filter(p => p.subject === filterSubject && (filterVolume === 'All' || p.volume === filterVolume) && p.sub_subject === filterSubSubject).flatMap(p => p.sections))];

      const getDisplayChapterName = (subject, chapterStr) => {
          if (!chapterStr) return '';
          if (chapterStr === 'All') return '全部單元';
          if (subject === '國文' || subject === '英文') {
              return chapterStr.replace(/[()（）]/g, ' ').replace(/\s+/g, ' ').trim();
          }
          return chapterStr.split('(')[0].trim();
      };

      const statsData = SUBJECT_ORDER.map(sub => {
         const subMistakes = mistakes.filter(m => m.subject === sub);
         if (subMistakes.length === 0) return null;

         const chapterMap = {};
         subMistakes.forEach(m => {
            const displayChap = getDisplayChapterName(m.subject, m.sub_subject);
            const key = (m.volume ? m.volume + ' - ' : '') + displayChap;
            chapterMap[key] = (chapterMap[key] || 0) + 1;
         });
         const chapters = Object.entries(chapterMap).sort((a, b) => b[1] - a[1]);

         return {
            subject: sub,
            total: subMistakes.length,
            chapters: chapters
         };
      }).filter(Boolean);

      const handlePrint = () => { setTimeout(() => { window.print(); }, 100); };

      const emptyMessage = isFetching ? '正在從雲端讀取錯題…'
        : readStatus !== 'server' ? '尚未確認雲端題目，請查看上方讀取狀態。'
        : mistakes.length === 0 ? '此雲端資料來源沒有題目，請確認與 iPad 的專案及使用者名稱一致。'
        : '找不到符合條件的錯題';

      return (
        <div className="nb-list min-h-screen bg-gray-50 relative">
          <div className="nb-list-header bg-[#f59e0b] text-[#ffffff] p-5 sticky top-0 z-10 shadow-md flex justify-between items-center no-print">
            <button onClick={onBack} className="p-2 hover:bg-[#d97706] rounded-full transition-colors"><Icons.ArrowLeft /></button>
            <div className="flex items-center gap-2">
               <h1 className="font-bold text-xl sm:text-2xl truncate max-w-[200px] sm:max-w-xs">📚 {currentProfile} 的雲端錯題本</h1>
               <div title={readStatus === 'server' ? '已收到雲端伺服器資料' : '雲端資料尚未確認'} className="ml-1"><Icons.StatusDot color={readStatus === 'server' ? "#4ade80" : "#fef08a"} /></div>
            </div>
            <button onClick={handlePrint} className="bg-white text-[#451a03] px-4 py-2.5 rounded-lg font-bold flex items-center gap-2 hover:bg-amber-50 transition-colors shadow-sm text-base">
              <Icons.Printer /> <span className="hidden sm:inline">🖨️ 輸出 PDF</span>
            </button>
          </div>

          <div className="nb-filters p-4 md:p-5 bg-white border-b no-print space-y-5">
            <div className="nb-sync w-[98%] max-w-[1400px] mx-auto p-3 rounded-xl border border-amber-200 bg-amber-50 text-sm" role="status">
              <div className="flex flex-wrap items-center justify-between gap-2">
                <span>{readStatus === 'server' ? `已從雲端讀取 ${mistakes.length} 題` : readStatus === 'cache' ? `目前顯示本機快取 ${mistakes.length} 題，等待雲端確認` : readStatus === 'waiting' ? '等待雲端登入完成' : readStatus === 'error' ? '雲端讀取失敗' : readStatus === 'timeout' ? '雲端回應逾時' : '正在讀取雲端錯題…'}</span>
                <button className="px-3 py-2 bg-white border rounded-lg font-bold" onClick={() => setReloadCount(n => n + 1)}>重新讀取</button>
              </div>
              {readError && <p className="mt-2 text-red-700 whitespace-pre-wrap">{readError}</p>}
              <details className="mt-2"><summary className="cursor-pointer">查看資料來源（可與 iPad 對照）</summary>
                <p className="mt-2 break-all">雲端專案：{FB?.db?.app?.options?.projectId || '尚未連線'}<br />使用者名稱：{JSON.stringify(currentProfile)}<br />資料位置：artifacts/{FB?.appId}/public/data/mistakes_{currentProfile}</p>
                <p className="mt-1">兩台裝置必須使用相同專案與完全相同的使用者名稱。登入成功不代表已成功讀取題目。</p>
              </details>
            </div>
            <div className="w-[98%] max-w-[1400px] mx-auto flex justify-center mb-2">
                <div className="bg-gray-100 p-1.5 rounded-2xl flex gap-2 w-full max-w-md shadow-inner">
                   <button onClick={() => setActiveTab('stats')} className={`flex-1 py-3 rounded-xl font-bold text-lg transition-all flex justify-center items-center gap-2 ${activeTab === 'stats' ? 'bg-white text-[#b45309] shadow-md transform scale-105' : 'text-gray-500 hover:text-gray-700'}`}>📊 弱點分析</button>
                   <button onClick={() => setActiveTab('list')} className={`flex-1 py-3 rounded-xl font-bold text-lg transition-all flex justify-center items-center gap-2 ${activeTab === 'list' ? 'bg-white text-[#b45309] shadow-md transform scale-105' : 'text-gray-500 hover:text-gray-700'}`}>📝 錯題列表</button>
                </div>
            </div>

            {activeTab === 'list' && (
              <>
                <div className="w-[98%] max-w-[1400px] mx-auto relative mt-4">
                   <div className="absolute left-4 top-3.5 text-gray-400"><Icons.Search /></div>
                   <input 
                      type="text" placeholder="搜尋標籤、核心知識、單元或筆記關鍵字..." 
                      className="w-full pl-12 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-[#f59e0b] outline-none transition-shadow text-lg font-bold"
                      value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)}
                   />
                </div>

                <div className="flex flex-col xl:flex-row gap-4 w-[98%] max-w-[1400px] mx-auto justify-between items-start xl:items-center mt-4">
                    <div className="flex gap-3 overflow-x-auto whitespace-nowrap w-full xl:w-auto scrollbar-hide pb-2">
                      {subjects.map(sub => (
                        <button key={sub} onClick={() => handleSubjectChange(sub)}
                          className={`px-5 py-2.5 rounded-full text-base font-bold transition-colors flex-shrink-0 border ${filterSubject === sub ? 'bg-[#f59e0b] text-[#ffffff] border-[#f59e0b]' : 'bg-white text-gray-600 hover:bg-gray-100 border-gray-200 shadow-sm'}`}>
                          {sub === 'All' ? '綜合' : sub}
                        </button>
                      ))}
                    </div>
                    
                    <div className="flex flex-wrap sm:flex-nowrap gap-3 w-full xl:w-auto">
                        {/* 狀態過濾 */}
                        <div className="flex gap-2 bg-gray-50 p-2 rounded-xl border border-gray-100 w-full sm:w-auto overflow-x-auto">
                            <button onClick={() => setFilterMastery('All')} className={`px-4 py-2 text-sm font-bold rounded-lg whitespace-nowrap ${filterMastery === 'All' ? 'bg-white shadow-md text-gray-800' : 'text-gray-500 hover:text-gray-700'}`}>全部熟練度</button>
                            <button onClick={() => setFilterMastery('need_review')} className={`px-4 py-2 text-sm font-bold rounded-lg whitespace-nowrap flex items-center gap-1.5 ${filterMastery === 'need_review' ? 'bg-white shadow-md text-red-600' : 'text-gray-500 hover:text-red-500'}`}>🔴 需複習</button>
                            <button onClick={() => setFilterMastery('mastered')} className={`px-4 py-2 text-sm font-bold rounded-lg whitespace-nowrap flex items-center gap-1.5 ${filterMastery === 'mastered' ? 'bg-white shadow-md text-green-600' : 'text-gray-500 hover:text-green-600'}`}>🟢 已掌握</button>
                        </div>
                        
                        {/* ★ 日期區間過濾 */}
                        <div className="flex items-center gap-2 bg-gray-50 p-2 rounded-xl border border-gray-100 flex-grow sm:flex-grow-0 min-w-max shadow-sm">
                            <span className="text-amber-600 pl-1"><Icons.Calendar /></span>
                            <input 
                                type="date" 
                                className="bg-transparent text-sm font-bold text-gray-700 outline-none cursor-pointer"
                                value={filterStartDate} 
                                onChange={e => setFilterStartDate(e.target.value)} 
                                title="開始日期"
                            />
                            <span className="text-gray-400 font-bold px-1">-</span>
                            <input 
                                type="date" 
                                className="bg-transparent text-sm font-bold text-gray-700 outline-none cursor-pointer"
                                value={filterEndDate} 
                                onChange={e => setFilterEndDate(e.target.value)} 
                                title="結束日期"
                            />
                            {(filterStartDate || filterEndDate) && (
                                <button onClick={() => { setFilterStartDate(''); setFilterEndDate(''); }} className="text-gray-400 hover:text-red-500 bg-gray-200 hover:bg-red-100 rounded-full p-1 ml-1 transition-colors" title="清除日期區間">
                                    <Icons.Close />
                                </button>
                            )}
                        </div>
                    </div>
                </div>
                
                {filterSubject !== 'All' && CURRICULUM_DB[filterSubject]?.hasVolume && availableVolumes.length > 1 && (
                  <div className="flex gap-3 w-[98%] max-w-[1400px] mx-auto pt-2 overflow-x-auto scrollbar-hide pb-2">
                    {availableVolumes.map(vol => (
                      <button key={vol} onClick={() => handleVolumeChange(vol)}
                        className={`px-4 py-2 rounded-full text-sm font-bold transition-colors flex-shrink-0 ${filterVolume === vol ? 'bg-[#b45309] text-white shadow-md' : 'bg-gray-50 text-gray-600 hover:bg-gray-200 border border-gray-200'}`}>
                        {vol === 'All' ? '全部冊別' : vol}
                      </button>
                    ))}
                  </div>
                )}

                {filterSubject !== 'All' && availableSubSubjects.length > 1 && (
                  <div className="flex gap-3 w-[98%] max-w-[1400px] mx-auto pt-4 border-t border-gray-100 border-dashed overflow-x-auto scrollbar-hide pb-2">
                    {availableSubSubjects.map(subSub => {
                      const displaySubSub = getDisplayChapterName(filterSubject, subSub);
                      return (
                        <button key={subSub} onClick={() => { setFilterSubSubject(subSub); setFilterSection('All'); }}
                          className={`px-4 py-2 rounded-full text-sm font-bold transition-colors flex-shrink-0 ${filterSubSubject === subSub ? 'bg-amber-600 text-white shadow-md' : 'bg-gray-50 text-gray-600 hover:bg-gray-200 border border-gray-200'}`}>
                          {displaySubSub}
                        </button>
                      );
                    })}
                  </div>
                )}
                {filterSubSubject !== 'All' && availableSections.length > 0 && (
                  <div className="w-[98%] max-w-[1400px] mx-auto pt-3">
                    <label className="font-bold text-amber-800">篩選小節： </label>
                    <select aria-label="篩選小節" className="p-3 border rounded-xl max-w-full" value={filterSection} onChange={e => setFilterSection(e.target.value)}>
                      <option value="All">全部小節</option><option value="">未分類小節（含舊資料）</option>
                      {availableSections.map(section => <option key={section}>{section}</option>)}
                    </select>
                  </div>
                )}
              </>
            )}
          </div>

          <div id="print-area" className="w-full">
             {activeTab === 'stats' && (
                <div className="p-4 md:p-6 w-[98%] max-w-[1400px] mx-auto space-y-8 bg-gray-50 print:bg-white">
                   <div className="text-center mb-8 no-print">
                      <h2 className="text-3xl sm:text-4xl font-black text-gray-800 mb-3">📊 錯題弱點分析</h2>
                      <p className="text-gray-500 font-bold text-lg">依照科目與章節彙總，快速找出最需要補強的單元！</p>
                   </div>
                   
                   <div className="hidden print:block text-center mb-8 print-header border-b-2 border-black pb-4">
                      <h1 className="text-4xl font-bold text-black">{currentProfile} 的 錯題弱點分析</h1>
                      <p className="text-gray-500 mt-2 text-lg">列印日期：{new Date().toLocaleDateString()}</p>
                   </div>

                   {statsData.length === 0 ? (
                      <div className="text-center py-24 text-gray-400 no-print">
                         <div className="flex justify-center mb-5 scale-150"><Icons.Cloud /></div>
                         <p className="mt-5 text-2xl font-bold">🔍 {emptyMessage}</p>
                      </div>
                   ) : (
                      <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 sm:gap-8">
                         {statsData.map(stat => {
                           const maxChapterCount = Math.max(...stat.chapters.map(c => c[1]));
                           return (
                             <div key={stat.subject} className="bg-white rounded-3xl p-6 sm:p-8 shadow-sm border border-gray-200 transition-all hover:shadow-md print:shadow-none print:border-black print:mb-6 break-inside-avoid">
                                <div className="flex justify-between items-center mb-6 border-b border-amber-100 print:border-gray-400 pb-4">
                                   <h3 className="text-2xl sm:text-3xl font-black text-[#b45309] print:text-black flex items-center gap-2"><Icons.Book /> {stat.subject}</h3>
                                   <span className="bg-[#fffbeb] border border-amber-200 print:border-black text-[#b45309] print:text-black px-4 py-1.5 rounded-xl font-bold text-lg">共 {stat.total} 題</span>
                                </div>
                                <div className="space-y-6">
                                   {stat.chapters.map(([chapName, count]) => {
                                      const pct = (count / maxChapterCount) * 100;
                                      const isWeakness = count === maxChapterCount && count > 1;
                                      const barColor = isWeakness ? 'bg-red-500 print:bg-black' : 'bg-[#f59e0b] print:bg-gray-500';
                                      const textColor = isWeakness ? 'text-red-600 print:text-black' : 'text-gray-700 print:text-black';
                                      
                                      return (
                                         <div key={chapName} className="flex flex-col gap-2">
                                            <div className="flex justify-between items-end gap-4">
                                               <span className={`font-bold text-sm sm:text-base break-words flex-1 ${textColor}`}>
                                                  {chapName}
                                                  {isWeakness && <span className="ml-2 text-xs bg-red-100 text-red-600 print:border print:border-black print:bg-white print:text-black px-2 py-0.5 rounded-full inline-block align-middle transform -translate-y-px">🚨 需補強</span>}
                                               </span>
                                               <span className={`font-black text-base sm:text-lg whitespace-nowrap ${textColor}`}>{count} 題</span>
                                            </div>
                                            <div className="w-full bg-gray-100 print:bg-transparent print:border print:border-gray-300 rounded-full h-3 overflow-hidden shadow-inner print:shadow-none">
                                               <div className={`${barColor} h-full rounded-full transition-all duration-1000`} style={{ width: `${pct}%` }}></div>
                                            </div>
                                         </div>
                                      );
                                   })}
                                </div>
                             </div>
                           );
                         })}
                      </div>
                   )}
                </div>
             )}

             {activeTab === 'list' && (
                <div className="p-4 md:p-5 print:p-0 w-[98%] max-w-[1400px] mx-auto space-y-8 print:space-y-0 bg-[#fffbeb] print:bg-white">
                  
                  <div className="hidden print:block text-center mb-8 print-header border-b-2 border-black pb-4">
                    <h1 className="text-4xl font-bold text-black">
                      {currentProfile} 的 {filterSubject === 'All' ? '綜合' : filterSubject} 
                      {filterVolume !== 'All' && ` - ${filterVolume}`}
                      {filterSubSubject !== 'All' && ` - ${getDisplayChapterName(filterSubject, filterSubSubject)}`}{filterSection !== 'All' && ` - ${filterSection || '未分類小節'}`} 錯題本
                    </h1>
                    <p className="text-gray-500 mt-2 text-lg">列印日期：{new Date().toLocaleDateString()}</p>
                  </div>

                  {filteredData.length === 0 ? (
                     <div className="text-center py-24 text-gray-400 no-print">
                        <div className="flex justify-center mb-5 scale-150"><Icons.Cloud /></div>
                        <p className="mt-5 text-2xl font-bold">🔍 {emptyMessage}</p>
                     </div>
                  ) : (
                    filteredData.map((item, index) => (
                      <div key={item.id} className={`bg-white p-7 print-card rounded-2xl shadow-sm border border-gray-200 print:shadow-none print:border-black break-inside-avoid print:bg-white ${item.subject === '數學' ? 'print-math-card' : ''} ${item.mastery === 'mastered' ? 'print:hidden' : ''}`}>
                        <div className="flex flex-col sm:flex-row justify-between items-start gap-4 mb-5 print:mb-1">
                          
                          <div className="flex items-start gap-3 sm:gap-4 w-full">
                              <div className="text-4xl print:text-xl font-black text-[#f59e0b] print:text-black leading-none pt-1 print:pt-0">
                                {String(index + 1).padStart(2, '0')}
                              </div>
                              
                              <div className="flex flex-wrap gap-3 print:gap-1.5 items-center w-full">
                                  <span className="bg-amber-50 print:bg-transparent print:border print:border-black text-[#b45309] print:text-black px-4 py-1.5 print:px-2 print:py-0.5 rounded-full text-base print:text-sm font-bold border border-amber-200">
                                    {item.subject} {item.volume ? item.volume : ''}
                                  </span>
                                  {item.sub_subject && (
                                    <span className="bg-gray-100 print:bg-transparent print:border print:border-black text-gray-700 print:text-black px-4 py-1.5 print:px-2 print:py-0.5 rounded-full text-base print:text-sm font-semibold">
                                        {getDisplayChapterName(item.subject, item.sub_subject)}
                                    </span>
                                  )}
                                  {(item.section || getSections(item.subject, item.volume, item.sub_subject).length > 0) && <span className="bg-amber-100 px-3 py-1 rounded-full font-bold">{item.section || '未分類小節'}</span>}
                                  {item.needs_review && <span className="text-red-600 font-bold">⚠️ AI 分析待確認</span>}
                                  <span className="bg-gray-100 print:bg-transparent print:border print:border-black text-gray-800 print:text-black px-4 py-1.5 print:px-2 print:py-0.5 rounded-full text-base print:text-sm font-bold">🎯 {item.concept}</span>
                                  
                                  {/* ★ 顯示建檔日期 */}
                                  <span className="text-sm font-bold text-gray-500 bg-gray-50 px-3 py-1.5 rounded-full flex items-center gap-1.5 border border-gray-200">
                                      <Icons.Calendar /> {item.created_date || getDateStr(item.timestamp)}
                                  </span>

                                  <button 
                                    onClick={() => handleUpdateMastery(item.id, item.mastery)}
                                    className={`no-print sm:ml-auto px-4 py-1.5 rounded-full text-base font-bold transition-colors border shadow-sm flex items-center gap-2 ${(!item.mastery || item.mastery === 'need_review') ? 'bg-red-50 text-red-600 border-red-200 hover:bg-red-100' : 'bg-green-50 text-green-600 border-green-200 hover:bg-green-100'}`}
                                    title="點擊切換熟練度"
                                  >
                                    {(!item.mastery || item.mastery === 'need_review') ? '🔴 需複習' : '🟢 已掌握'}
                                  </button>
                              </div>
                          </div>

                          <div className="flex items-center gap-2 self-end sm:self-auto no-print flex-shrink-0">
                              <button onClick={() => onFullEdit(item)} className="text-gray-500 hover:text-[#f59e0b] bg-gray-100 hover:bg-amber-50 px-3 py-2 rounded-lg font-bold text-sm transition-colors flex items-center gap-1 shadow-sm" title="完整編輯內容"><Icons.Edit /> 完整編輯</button>
                              <button onClick={() => handleDelete(item.id)} className="text-gray-400 hover:text-red-500 hover:bg-red-50 p-2 rounded-lg transition-colors" title="刪除錯題"><Icons.Trash /></button>
                          </div>
                        </div>

                        {item.tags && item.tags.length > 0 && (
                            <div className="flex flex-wrap gap-2 mb-4 print:hidden">
                                {item.tags.map(tag => (
                                    <span key={tag} className="text-sm font-bold text-amber-700 bg-amber-50 border border-amber-100 px-3 py-1 rounded-md flex items-center gap-1.5"><Icons.Tag />{tag}</span>
                                ))}
                            </div>
                        )}
                        
                        <div className="mb-5 bg-white relative group cursor-pointer" onClick={() => setLightboxImage(item.image)}>
                           <img 
                             src={item.image} 
                             alt="Question" 
                             className="max-w-full h-auto border border-gray-200 rounded-xl print:border-none print-img mx-auto print:ml-0 print:mr-auto block bg-white transition-opacity group-hover:opacity-90" 
                             style={item.printWidth ? { width: `${item.printWidth}px` } : {}}
                           />
                           <div className="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity no-print pointer-events-none">
                              <div className="bg-black/60 text-white rounded-full p-4 backdrop-blur-sm"><Icons.ZoomIn /></div>
                           </div>
                        </div>

                        {(item.ai_tutor || item.answer || item.notes) && (
                          <div className="bg-amber-50 p-5 rounded-2xl border border-amber-200 print:hidden space-y-5">
                            {(item.ai_tutor || item.answer) && (
                              <div>
                                <div className="font-bold text-gray-800 text-xl mb-2 flex items-center justify-between cursor-pointer" onClick={() => toggleSection(item.id, 'ai')}>
                                   <div className="flex items-center gap-2">🤖 AI老師教學 / 解答</div>
                                   <button className="text-gray-500 hover:text-amber-600 transition-colors no-print font-bold flex items-center gap-1">
                                       {expandedSections[`${item.id}_ai`] ? '🐾 收起' : '✨ 顯示'}
                                   </button>
                                </div>
                                {expandedSections[`${item.id}_ai`] && (
                                    <div className="text-gray-800 text-lg bg-white/60 p-4 rounded-xl shadow-sm border border-amber-100/50">
                                       <LatexText content={item.ai_tutor || item.answer} className="whitespace-pre-wrap leading-relaxed" />
                                    </div>
                                )}
                              </div>
                            )}
                            {item.notes && (
                              <div>
                                <div className="font-bold text-[#b45309] text-xl mb-2 flex items-center justify-between cursor-pointer" onClick={() => toggleSection(item.id, 'note')}>
                                   <div className="flex items-center gap-2">📝 錯題筆記 / 訂正過程</div>
                                   <button className="text-gray-500 hover:text-amber-600 transition-colors no-print font-bold flex items-center gap-1">
                                       {expandedSections[`${item.id}_note`] ? '🐾 收起' : '✨ 顯示'}
                                   </button>
                                </div>
                                {expandedSections[`${item.id}_note`] && (
                                    <img src={item.notes} alt="Handwritten Notes" className="w-full h-auto object-contain bg-white border border-amber-200 rounded-xl shadow-sm" style={{ maxHeight: '600px' }} />
                                )}
                              </div>
                            )}
                          </div>
                        )}
                      </div>
                    ))
                  )}
                  
                  <div className="no-print text-center py-8 text-base text-gray-400 font-bold">
                    💡 列印時會自動隱藏解析與筆記，產生極簡版錯題卷。<br/>若點擊「輸出 PDF」無反應，請使用瀏覽器右上角的「分享」→「列印」功能。
                  </div>
                </div>
             )}
          </div>
          
          {lightboxImage && (
              <div className="fixed inset-0 z-[9999] bg-black/90 flex flex-col p-4 animate-[fadeIn_0.2s_ease-out]" onClick={() => setLightboxImage(null)}>
                  <div className="flex justify-end p-2 text-white">
                      <button className="hover:text-amber-500 transition-colors p-2" onClick={() => setLightboxImage(null)}><Icons.Close /></button>
                  </div>
                  <div className="flex-grow flex items-center justify-center overflow-auto p-4 cursor-zoom-out">
                      <img src={lightboxImage} alt="Fullscreen View" className="max-w-full max-h-full object-contain bg-white rounded-lg" onClick={(e) => e.stopPropagation()} />
                  </div>
              </div>
          )}
        </div>
      );
    }

    // --- STREAMING_CHUNK:Finalizing rendering... ---
    // 渲染應用程式 (透過 ModalProvider 包裝)
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
