<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚙️ 決戰會考 - 知識點匯入工具</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
  <style> body { font-family: sans-serif; background-color: #f8fafc; } </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const SUBJECTS = ['國文', '英文', '數學', '生物', '理化', '地球科學', '歷史', '地理', '公民'];

    function MigrationApp() {
      const [fbConfig, setFbConfig] = useState(() => {
        const saved = localStorage.getItem('poppinsFbConfig');
        return saved ? JSON.parse(saved) : null;
      });
      const [FB, setFB] = useState(null);
      const [user, setUser] = useState(null);
      
      const [subject, setSubject] = useState('生物');
      const [inputText, setInputText] = useState('');
      const [parsedData, setParsedData] = useState([]);
      const [isUploading, setIsUploading] = useState(false);
      const [status, setStatus] = useState('');

      // 初始化 Firebase
      useEffect(() => {
        if (!fbConfig) return;
        const initFirebase = async () => {
          try {
            const fbApp = await new Function('return import("https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js")')();
            const fbAuth = await new Function('return import("https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js")')();
            const fbDb = await new Function('return import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js")')();
            
            const app = fbApp.initializeApp(fbConfig);
            const auth = fbAuth.getAuth(app);
            const db = fbDb.getFirestore(app);
            
            setFB({ ...fbApp, ...fbAuth, ...fbDb, db, auth });
            
            await fbAuth.signInAnonymously(auth);
            fbAuth.onAuthStateChanged(auth, (currentUser) => {
              setUser(currentUser);
            });
          } catch (e) {
            setStatus("Firebase 初始化失敗: " + e.message);
          }
        };
        initFirebase();
      }, [fbConfig]);

      const handleParse = () => {
        const lines = inputText.split('\n');
        let currentChapter = '';
        let currentFocus = '';
        const results = [];

        for (const line of lines) {
          const trimmed = line.trim();
          if (trimmed.startsWith('## ')) {
            currentChapter = trimmed.replace('## ', '').trim();
          } else if (trimmed.startsWith('### ')) {
            currentFocus = trimmed.replace('### ', '').trim();
          } else if (trimmed.startsWith('|') && !trimmed.includes('---|')) {
            const parts = trimmed.split('|').map(p => p.trim()).filter(Boolean);
            // 標題列防呆
            if (parts.length >= 4 && parts[0] !== '編號') {
              results.push({
                subject: subject,
                chapter: currentChapter,
                focus: currentFocus,
                point_id: parts[0],
                point_name: parts[1],
                description: parts[2],
                page: parts[3]
              });
            }
          }
        }
        setParsedData(results);
        setStatus(`解析成功，共找到 ${results.length} 個知識點。`);
      };

      const handleUpload = async () => {
        if (!FB || !user) return alert('Firebase 尚未連線');
        if (parsedData.length === 0) return alert('沒有可上傳的資料');
        
        setIsUploading(true);
        setStatus('開始上傳至雲端...');
        
        try {
          const batch = FB.writeBatch(FB.db);
          let count = 0;
          
          for (const item of parsedData) {
            // 使用 科目_編號 作為文件 ID 避免重複 (例如: 生物_1-01)
            const docId = `${item.subject}_${item.point_id}`;
            const docRef = FB.doc(FB.db, 'artifacts', fbConfig.projectId, 'public', 'data', 'knowledge_points', docId);
            batch.set(docRef, { ...item, updated_at: Date.now() });
            count++;
            
            // Firestore batch 上限是 500
            if (count % 400 === 0) {
              await batch.commit();
              setStatus(`已上傳 ${count} 筆...`);
            }
          }
          await batch.commit(); // 提交剩餘的
          setStatus(`🎉 上傳完成！成功寫入 ${count} 個知識點至資料庫。`);
          setParsedData([]);
          setInputText('');
        } catch (e) {
          setStatus('上傳失敗: ' + e.message);
        }
        setIsUploading(false);
      };

      if (!fbConfig) {
        return <div className="p-10 text-center text-xl text-red-500 font-bold">找不到 Firebase 設定，請先在主程式中登入設定。</div>;
      }

      return (
        <div className="max-w-6xl mx-auto p-6">
          <h1 className="text-3xl font-bold mb-6 text-indigo-700">⚙️ 知識點資料庫匯入工具 (Migration Tool)</h1>
          
          <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-200 mb-6">
            <div className="flex gap-4 items-center mb-4">
              <label className="font-bold text-gray-700">選擇科目：</label>
              <select className="border border-gray-300 rounded-lg p-2 font-bold" value={subject} onChange={e => setSubject(e.target.value)}>
                {SUBJECTS.map(s => <option key={s} value={s}>{s}</option>)}
              </select>
            </div>
            
            <textarea 
              className="w-full h-64 p-4 border border-gray-300 rounded-lg bg-gray-50 focus:ring-2 focus:ring-indigo-500 font-mono text-sm mb-4"
              placeholder="請貼上 Markdown 表格資料...\n\n## ch1 科學方法與生命的組成\n### 焦點 1　探究自然的科學方法\n| 編號 | 核心知識點 | 重點說明 | 印刷頁碼 |\n|---|---|---|---|\n| 1-01 | 科學方法流程 | ... | 8 |"
              value={inputText}
              onChange={e => setInputText(e.target.value)}
            />
            
            <div className="flex gap-4">
              <button onClick={handleParse} className="bg-gray-800 text-white px-6 py-2 rounded-lg font-bold hover:bg-gray-700 transition">🔍 解析文字</button>
              <button onClick={handleUpload} disabled={isUploading || parsedData.length === 0} className="bg-indigo-600 text-white px-6 py-2 rounded-lg font-bold hover:bg-indigo-500 disabled:opacity-50 transition">
                {isUploading ? '☁️ 上傳中...' : '☁️ 上傳至 Firestore'}
              </button>
            </div>
            {status && <div className="mt-4 p-3 bg-indigo-50 text-indigo-800 rounded-lg font-bold border border-indigo-100">{status}</div>}
          </div>

          {parsedData.length > 0 && (
            <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-200 overflow-x-auto">
              <h2 className="text-xl font-bold mb-4">預覽解析結果 ({parsedData.length} 筆)</h2>
              <table className="min-w-full border-collapse text-sm">
                <thead>
                  <tr className="bg-gray-100 text-left">
                    <th className="border p-2">章節</th>
                    <th className="border p-2">焦點</th>
                    <th className="border p-2">編號</th>
                    <th className="border p-2">名稱</th>
                    <th className="border p-2 w-1/3">說明</th>
                    <th className="border p-2">頁碼</th>
                  </tr>
                </thead>
                <tbody>
                  {parsedData.map((item, i) => (
                    <tr key={i} className="hover:bg-gray-50">
                      <td className="border p-2 truncate max-w-[150px]">{item.chapter}</td>
                      <td className="border p-2 truncate max-w-[150px]">{item.focus}</td>
                      <td className="border p-2 font-bold text-indigo-600">{item.point_id}</td>
                      <td className="border p-2 font-bold">{item.point_name}</td>
                      <td className="border p-2 truncate max-w-xs">{item.description}</td>
                      <td className="border p-2 font-bold text-amber-600">{item.page}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<MigrationApp />);
  </script>
</body>
</html>
