<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚙️ 決戰會考 - 知識點匯入與管理工具</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
  <style> 
    body { font-family: sans-serif; background-color: #f8fafc; } 
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const SUBJECTS = ['國文', '英文', '數學', '生物', '理化', '地球科學', '歷史', '地理', '公民'];

    function MigrationApp() {
      const [fbConfig, setFbConfig] = useState(() => {
        const saved = localStorage.getItem('poppinsFbConfig');
        return saved ? JSON.parse(saved) : null;
      });
      const [FB, setFB] = useState(null);
      const [user, setUser] = useState(null);
      
      const [activeTab, setActiveTab] = useState('import'); // 'import' | 'manage'

      // --- 匯入模式狀態 ---
      const [subject, setSubject] = useState('生物');
      const [inputText, setInputText] = useState('');
      const [parsedData, setParsedData] = useState([]);
      const [isUploading, setIsUploading] = useState(false);
      const [status, setStatus] = useState('');

      // --- 管理模式狀態 ---
      const [dbItems, setDbItems] = useState([]);
      const [isFetchingDb, setIsFetchingDb] = useState(false);
      const [manageFilterSubject, setManageFilterSubject] = useState('All');

      // 初始化 Firebase
      useEffect(() => {
        if (!fbConfig) return;
        const initFirebase = async () => {
          try {
            const fbApp = await new Function('return import("https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js")')();
            const fbAuth = await new Function('return import("https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js")')();
            const fbDb = await new Function('return import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js")')();
            
            const app = fbApp.initializeApp(fbConfig);
            const auth = fbAuth.getAuth(app);
            const db = fbDb.getFirestore(app);
            
            setFB({ ...fbApp, ...fbAuth, ...fbDb, db, auth });
            
            await fbAuth.signInAnonymously(auth);
            fbAuth.onAuthStateChanged(auth, (currentUser) => {
              setUser(currentUser);
            });
          } catch (e) {
            setStatus("Firebase 初始化失敗: " + e.message);
          }
        };
        initFirebase();
      }, [fbConfig]);

      // 當切換到管理分頁時，自動載入資料庫內容
      useEffect(() => {
        if (activeTab === 'manage' && FB && user) {
            loadDatabase();
        }
      }, [activeTab, FB, user]);

      // ==========================================
      //               匯入模式功能
      // ==========================================
      const handleParse = () => {
        const lines = inputText.split('\n');
        let currentChapter = '';
        let currentFocus = '';
        const results = [];

        for (const line of lines) {
          const trimmed = line.trim();
          if (trimmed.startsWith('## ')) {
            currentChapter = trimmed.replace('## ', '').trim();
          } else if (trimmed.startsWith('### ')) {
            currentFocus = trimmed.replace('### ', '').trim();
          } else if (trimmed.startsWith('|') && !trimmed.includes('---|')) {
            const parts = trimmed.split('|').map(p => p.trim()).filter(Boolean);
            // 標題列防呆
            if (parts.length >= 4 && parts[0] !== '編號') {
              results.push({
                subject: subject,
                chapter: currentChapter,
                focus: currentFocus,
                point_id: parts[0],
                point_name: parts[1],
                description: parts[2],
                page: parts[3]
              });
            }
          }
        }
        setParsedData(results);
        setStatus(`解析成功，共找到 ${results.length} 個知識點。`);
      };

      const handleUpload = async () => {
        if (!FB || !user) return alert('Firebase 尚未連線');
        if (parsedData.length === 0) return alert('沒有可上傳的資料');
        
        setIsUploading(true);
        setStatus('開始上傳至雲端...');
        
        try {
          const batch = FB.writeBatch(FB.db);
          let count = 0;
          
          for (const item of parsedData) {
            // 使用 科目_編號 作為文件 ID 避免重複 (例如: 生物_1-01)
            const docId = `${item.subject}_${item.point_id}`;
            // ★ 正確的路徑：加入 data 層級，總共6層 (偶數)
            const docRef = FB.doc(FB.db, 'artifacts', fbConfig.projectId, 'public', 'data', 'knowledge_points', docId);
            batch.set(docRef, { ...item, updated_at: Date.now() });
            count++;
            
            // Firestore batch 上限是 500
            if (count % 400 === 0) {
              await batch.commit();
              setStatus(`已上傳 ${count} 筆...`);
            }
          }
          await batch.commit(); // 提交剩餘的
          setStatus(`🎉 上傳完成！成功寫入 ${count} 個知識點至資料庫。`);
          setParsedData([]);
          setInputText('');
        } catch (e) {
          setStatus('上傳失敗: ' + e.message);
        }
        setIsUploading(false);
      };

      // ==========================================
      //               管理模式功能
      // ==========================================
      const loadDatabase = async () => {
          setIsFetchingDb(true);
          try {
              // 讀取所有知識點
              const colRef = FB.collection(FB.db, 'artifacts', fbConfig.projectId, 'public', 'data', 'knowledge_points');
              const snapshot = await FB.getDocs(colRef);
              const items = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
              
              // 依科目與編號排序
              items.sort((a, b) => {
                  if (a.subject !== b.subject) return a.subject.localeCompare(b.subject);
                  return (a.point_id || '').localeCompare(b.point_id || '');
              });
              
              setDbItems(items);
          } catch (e) {
              alert('讀取資料庫失敗: ' + e.message);
          }
          setIsFetchingDb(false);
      };

      const handleDeleteItem = async (id, pointName) => {
          if (!confirm(`確定要刪除「${pointName}」這筆知識點嗎？`)) return;
          try {
              await FB.deleteDoc(FB.doc(FB.db, 'artifacts', fbConfig.projectId, 'public', 'data', 'knowledge_points', id));
              setDbItems(prev => prev.filter(item => item.id !== id));
          } catch (e) {
              alert('刪除失敗: ' + e.message);
          }
      };

      const handleDeleteSubject = async (subj) => {
          if (!confirm(`⚠️ 警告：您確定要清空【${subj}】的所有雲端知識點嗎？\n這項操作無法復原！`)) return;
          setIsFetchingDb(true);
          try {
              const itemsToDelete = dbItems.filter(item => item.subject === subj);
              // 依序刪除 (適用於中小型資料集)
              const deletePromises = itemsToDelete.map(item => 
                  FB.deleteDoc(FB.doc(FB.db, 'artifacts', fbConfig.projectId, 'public', 'data', 'knowledge_points', item.id))
              );
              await Promise.all(deletePromises);
              alert(`成功清空了 ${itemsToDelete.length} 筆【${subj}】的資料！`);
              loadDatabase(); // 重新讀取
          } catch (e) {
              alert('清空失敗: ' + e.message);
          }
          setIsFetchingDb(false);
      };

      // 計算各科目統計數據
      const subjectStats = useMemo(() => {
          const stats = {};
          SUBJECTS.forEach(s => stats[s] = 0);
          dbItems.forEach(item => {
              if (stats[item.subject] !== undefined) {
                  stats[item.subject]++;
              }
          });
          return stats;
      }, [dbItems]);

      const filteredDbItems = useMemo(() => {
          if (manageFilterSubject === 'All') return dbItems;
          return dbItems.filter(item => item.subject === manageFilterSubject);
      }, [dbItems, manageFilterSubject]);


      if (!fbConfig) {
        return <div className="p-10 text-center text-xl text-red-500 font-bold">找不到 Firebase 設定，請先在主程式中登入設定。</div>;
      }

      return (
        <div className="max-w-6xl mx-auto p-6">
          <div className="flex justify-between items-center mb-6">
              <h1 className="text-3xl font-bold text-indigo-700 flex items-center gap-2">
                ⚙️ 知識點資料庫工具
              </h1>
          </div>

          {/* 分頁導覽 */}
          <div className="flex gap-2 mb-6 border-b border-gray-300">
              <button 
                onClick={() => setActiveTab('import')}
                className={`px-6 py-3 font-bold text-lg rounded-t-xl transition-colors ${activeTab === 'import' ? 'bg-indigo-600 text-white shadow-md' : 'bg-gray-200 text-gray-600 hover:bg-gray-300'}`}
              >
                  📥 解析與匯入資料
              </button>
              <button 
                onClick={() => setActiveTab('manage')}
                className={`px-6 py-3 font-bold text-lg rounded-t-xl transition-colors ${activeTab === 'manage' ? 'bg-indigo-600 text-white shadow-md' : 'bg-gray-200 text-gray-600 hover:bg-gray-300'}`}
              >
                  🗄️ 雲端資料庫管理
              </button>
          </div>
          
          {/* ==================== 匯入模式 UI ==================== */}
          {activeTab === 'import' && (
            <div>
              <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-200 mb-6">
                <div className="flex gap-4 items-center mb-4">
                  <label className="font-bold text-gray-700">選擇匯入科目：</label>
                  <select className="border border-gray-300 rounded-lg p-2 font-bold focus:ring-2 focus:ring-indigo-500" value={subject} onChange={e => setSubject(e.target.value)}>
                    {SUBJECTS.map(s => <option key={s} value={s}>{s}</option>)}
                  </select>
                </div>
                
                <textarea 
                  className="w-full h-64 p-4 border border-gray-300 rounded-lg bg-gray-50 focus:ring-2 focus:ring-indigo-500 font-mono text-sm mb-4 leading-relaxed"
                  placeholder="請貼上 ChatGPT 產生的 Markdown 表格資料...\n\n## ch1 科學方法與生命的組成\n### 焦點 1　探究自然的科學方法\n| 編號 | 核心知識點 | 重點說明 | 印刷頁碼 |\n|---|---|---|---|\n| 1-01 | 科學方法流程 | ... | 8 |"
                  value={inputText}
                  onChange={e => setInputText(e.target.value)}
                />
                
                <div className="flex gap-4">
                  <button onClick={handleParse} className="bg-gray-800 text-white px-6 py-3 rounded-lg font-bold hover:bg-gray-700 transition flex items-center gap-2">🔍 預覽解析結果</button>
                  <button onClick={handleUpload} disabled={isUploading || parsedData.length === 0} className="bg-indigo-600 text-white px-6 py-3 rounded-lg font-bold hover:bg-indigo-500 disabled:opacity-50 transition flex items-center gap-2">
                    {isUploading ? '☁️ 雲端寫入中...' : '☁️ 正式上傳至 Firestore'}
                  </button>
                </div>
                {status && <div className="mt-4 p-4 bg-indigo-50 text-indigo-800 rounded-lg font-bold border border-indigo-100 flex items-center gap-2">ℹ️ {status}</div>}
              </div>

              {parsedData.length > 0 && (
                <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-200 overflow-x-auto">
                  <h2 className="text-xl font-bold mb-4 flex items-center gap-2">👀 預覽解析結果 <span className="bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full text-sm">{parsedData.length} 筆</span></h2>
                  <table className="min-w-full border-collapse text-sm">
                    <thead>
                      <tr className="bg-gray-100 text-left">
                        <th className="border p-3 text-gray-700">章節</th>
                        <th className="border p-3 text-gray-700">焦點</th>
                        <th className="border p-3 text-gray-700 whitespace-nowrap">編號</th>
                        <th className="border p-3 text-gray-700">名稱</th>
                        <th className="border p-3 w-1/3 text-gray-700">說明</th>
                        <th className="border p-3 text-gray-700 whitespace-nowrap">頁碼</th>
                      </tr>
                    </thead>
                    <tbody>
                      {parsedData.map((item, i) => (
                        <tr key={i} className="hover:bg-gray-50 transition-colors">
                          <td className="border p-3 text-gray-600 truncate max-w-[150px]" title={item.chapter}>{item.chapter}</td>
                          <td className="border p-3 text-gray-600 truncate max-w-[150px]" title={item.focus}>{item.focus}</td>
                          <td className="border p-3 font-bold text-indigo-600">{item.point_id}</td>
                          <td className="border p-3 font-bold text-gray-800">{item.point_name}</td>
                          <td className="border p-3 text-gray-600 leading-relaxed text-xs">{item.description}</td>
                          <td className="border p-3 font-bold text-amber-600 text-center">{item.page}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
            </div>
          )}

          {/* ==================== 管理模式 UI ==================== */}
          {activeTab === 'manage' && (
            <div className="space-y-6">
              {/* 狀態總覽卡片 */}
              <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                  <div className="flex justify-between items-center mb-4">
                      <h2 className="text-xl font-bold text-gray-800 flex items-center gap-2">📊 雲端資料庫狀態總覽</h2>
                      <button onClick={loadDatabase} className="bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2 rounded-lg font-bold transition text-sm flex items-center gap-1">
                          🔄 重新整理
                      </button>
                  </div>
                  
                  {isFetchingDb ? (
                      <div className="text-center py-10 text-indigo-500 font-bold animate-pulse">正在讀取雲端資料...</div>
                  ) : (
                      <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4">
                          {SUBJECTS.map(subj => (
                              <div key={subj} onClick={() => setManageFilterSubject(subj)} className={`cursor-pointer border p-4 rounded-xl flex flex-col items-center transition-all ${manageFilterSubject === subj ? 'bg-indigo-50 border-indigo-500 ring-2 ring-indigo-200' : 'bg-gray-50 hover:bg-gray-100 border-gray-200'}`}>
                                  <span className="font-bold text-gray-700 mb-1">{subj}</span>
                                  <span className={`text-2xl font-black ${subjectStats[subj] > 0 ? 'text-indigo-600' : 'text-gray-400'}`}>
                                      {subjectStats[subj]} <span className="text-sm font-normal text-gray-500">筆</span>
                                  </span>
                              </div>
                          ))}
                      </div>
                  )}
              </div>

              {/* 明細列表 */}
              {!isFetchingDb && (
                  <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                      <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
                          <div className="flex items-center gap-3">
                              <label className="font-bold text-gray-700">篩選顯示：</label>
                              <select className="border border-gray-300 rounded-lg p-2 font-bold focus:ring-2 focus:ring-indigo-500" value={manageFilterSubject} onChange={e => setManageFilterSubject(e.target.value)}>
                                <option value="All">全部顯示 (共 {dbItems.length} 筆)</option>
                                {SUBJECTS.map(s => <option key={s} value={s}>{s} ({subjectStats[s]} 筆)</option>)}
                              </select>
                          </div>
                          
                          {manageFilterSubject !== 'All' && subjectStats[manageFilterSubject] > 0 && (
                              <button onClick={() => handleDeleteSubject(manageFilterSubject)} className="bg-red-50 text-red-600 border border-red-200 hover:bg-red-100 hover:text-red-700 px-4 py-2 rounded-lg font-bold transition flex items-center gap-2 text-sm">
                                  🗑️ 一鍵清空【{manageFilterSubject}】所有資料
                              </button>
                          )}
                      </div>

                      {filteredDbItems.length === 0 ? (
                          <div className="text-center py-16 text-gray-400 font-bold bg-gray-50 rounded-xl border border-dashed border-gray-300">
                              此分類目前沒有任何資料。
                          </div>
                      ) : (
                          <div className="overflow-x-auto">
                              <table className="min-w-full border-collapse text-sm">
                                <thead>
                                  <tr className="bg-gray-100 text-left">
                                    <th className="border p-3 text-gray-700 whitespace-nowrap">操作</th>
                                    <th className="border p-3 text-gray-700">科目</th>
                                    <th className="border p-3 text-gray-700 whitespace-nowrap">編號</th>
                                    <th className="border p-3 text-gray-700">章節</th>
                                    <th className="border p-3 text-gray-700">核心知識點</th>
                                    <th className="border p-3 w-1/3 text-gray-700">重點說明</th>
                                    <th className="border p-3 text-gray-700 whitespace-nowrap">頁碼</th>
                                  </tr>
                                </thead>
                                <tbody>
                                  {filteredDbItems.map((item) => (
                                    <tr key={item.id} className="hover:bg-gray-50 transition-colors">
                                      <td className="border p-3 text-center">
                                          <button onClick={() => handleDeleteItem(item.id, item.point_name)} className="text-gray-400 hover:text-red-600 bg-gray-100 hover:bg-red-50 p-1.5 rounded transition">
                                              刪除
                                          </button>
                                      </td>
                                      <td className="border p-3 font-bold text-gray-600 whitespace-nowrap">{item.subject}</td>
                                      <td className="border p-3 font-bold text-indigo-600 whitespace-nowrap">{item.point_id}</td>
                                      <td className="border p-3 text-gray-600 truncate max-w-[150px]" title={item.chapter}>{item.chapter}</td>
                                      <td className="border p-3 font-bold text-gray-800">{item.point_name}</td>
                                      <td className="border p-3 text-gray-600 leading-relaxed text-xs">{item.description}</td>
                                      <td className="border p-3 font-bold text-amber-600 text-center">{item.page}</td>
                                    </tr>
                                  ))}
                                </tbody>
                              </table>
                          </div>
                      )}
                  </div>
              )}
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<MigrationApp />);
  </script>
</body>
</html>
